# Game news and injury coverage, pulled from a GitHub runner every two
# hours while a slate is open and written to data/feeds/w<week>.json.
# Google and Bing throttle the Worker's address range but not GitHub's,
# so this is where the searching lives. The phone reads the file from
# brochiefs.com and sends the injury articles to the Worker for extraction.
name: Fetch feeds

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch-feeds.mjs"]

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull the feeds
        run: node scripts/fetch-feeds.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feeds
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Feeds $(date -u +%Y%m%d%H%M) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      # Read every game once so phones find a warm cache. The Worker reads
      # the feed file from GitHub's raw URL, which can lag a push by a
      # minute, hence the pause. Always runs, so a quiet pull still
      # refreshes a cache that aged out.
      - name: Warm the injury cache
        if: always()
        run: |
          f=$(ls data/feeds/w*.json | sort -V | tail -1); [ -n "$f" ] || exit 0
          week=$(node -e "console.log(require('./$f').week)")
          sleep 75
          for g in $(node -e "console.log(Object.keys(require('./$f').games).join(' '))"); do
            curl -sS --max-time 90 "https://liftr-ai.jhs797.workers.dev/insights/injuries?week=$week&game=$g" | head -c 300; echo
            curl -sS --max-time 90 "https://liftr-ai.jhs797.workers.dev/insights/picks?week=$week&game=$g" | head -c 300; echo
          done
