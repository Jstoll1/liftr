# Deploys the Cloudflare Worker whenever the worker code changes on main.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers & Pages overview page
# Worker secrets set with `wrangler secret put` (OpenAI key, archive log key)
# live on Cloudflare and are untouched by deploys.
name: Deploy Worker

# The nfl branch deploys the NFL Worker (liftr-nfl, wrangler env "nfl");
# main deploys the college one.
on:
  push:
    branches: [main, nfl]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

# Each league deploys in its own queue: an NFL deploy never waits on, or
# holds up, a college one.
concurrency:
  group: deploy-worker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A failing test stops the deploy: the live Worker keeps running.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test worker/test/*.test.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy${{ github.ref_name == 'nfl' && ' --env nfl' || '' }}
