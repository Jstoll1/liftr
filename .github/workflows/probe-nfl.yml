# NFL branch only: GET the NFL Worker's public routes listed in
# probe/nfl.txt and print the answers, to check the deployed NFL Worker
# from a runner that can reach it. Read only, no secrets. Never touches
# the college Worker.
name: Probe NFL Worker

on:
  push:
    branches: [nfl]
    paths: ["probe/nfl.txt"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GET each route in probe/nfl.txt
        run: |
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            echo "=== GET $p"
            case "$p" in
              # ESPN image CDN: status, type, size and dimensions only.
              https://a.espncdn.com/*)
                curl -sS --max-time 30 -o /tmp/probe.bin -w "%{http_code} %{content_type} %{size_download}B\n" "$p"
                file /tmp/probe.bin ;;
              *)
                curl -sS --max-time 60 "https://liftr-nfl.jhs797.workers.dev$p" | head -c 6000 ;;
            esac
            echo
          done < probe/nfl.txt
