# Every Monday after the seal and the audit, copy the season's ledger out
# of KV and into the repo. If the record changed, that lands as a commit;
# if not, nothing happens. Run it by hand from the Actions tab any time.
name: Archive ledger

on:
  schedule:
    - cron: "0 12 * * 1"   # Monday 08:00 ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/archive-ledger.mjs
      - name: Commit if the record changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season-2026
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Archive ledger through $(date -u +%Y-%m-%d) [skip ci]"
          git push
