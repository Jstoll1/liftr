# Probe a Worker route from a runner that can reach it, for debugging feeds
# without a phone. Push the route into probe/request.txt and read the log.
# Read-only: GET only, no secrets.
name: Probe Worker

on:
  push:
    branches: [main]
    paths: ["probe/request.txt"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GET each route in probe/request.txt
        run: |
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            echo "=== GET $p"
            case "$p" in
              # ESPN image CDN: report status, type, size and dimensions only.
              https://a.espncdn.com/*)
                curl -sS --max-time 30 -o /tmp/probe.bin -w "%{http_code} %{content_type} %{size_download}B\n" "$p"
                file /tmp/probe.bin ;;
              *)
                curl -sS --max-time 90 "https://liftr-ai.jhs797.workers.dev$p" | head -c 8000 ;;
            esac
            echo
          done < probe/request.txt
