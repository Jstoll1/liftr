# Probe a Worker route from a runner that can reach it, for debugging feeds
# without a phone. Push the route into probe/request.txt and read the log.
# Read-only: GET only, no secrets. ESPN API lines print a compact summary.
name: Probe Worker

on:
  push:
    branches: [main]
    paths: ["probe/request.txt"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GET each route in probe/request.txt
        run: |
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            echo "=== GET $p"
            case "$p" in
              # ESPN image CDN: report status, type, size and dimensions only.
              https://a.espncdn.com/*)
                curl -sS --max-time 30 -o /tmp/probe.bin -w "%{http_code} %{content_type} %{size_download}B\n" "$p"
                file /tmp/probe.bin ;;
              # ESPN's public team list: id and names only.
              https://site.api.espn.com/*/teams\?*)
                curl -sS --max-time 30 "$p" | jq -r '.sports[0].leagues[0].teams[].team | [.id, .displayName, .shortDisplayName, .location, .abbreviation] | @tsv' ;;
              # ESPN's public API: a compact summary only (status, lines).
              https://site.api.espn.com/*)
                curl -sS --max-time 30 "$p" | jq -r '
                  if .events then .events[] | [.id, .shortName, .status.type.state, .status.type.shortDetail, (.competitions[0].odds[0].details // "no line"), (.competitions[0].odds[0].overUnder // "-"), ([.competitions[0].competitors[] | "\(.homeAway) \(.score)"] | join(" ")), (.competitions[0].situation.lastPlay.probability.homeWinPercentage // "-")] | @tsv
                  else ([.header.competitions[0].status.type.shortDetail // "-"] + [(.pickcenter // [])[] | "\(.provider.name // "?"): \(.details // "-") spread \(.spread // "-") o/u \(.overUnder // "-")"]) | join(" | ")
                  end' | head -c 12000 ;;
              # The sites themselves: which build they serve, nothing else.
              https://*brochiefs.com/*|https://liftr-1h0.pages.dev/*)
                curl -sS --max-time 30 "$p" | grep -o 'app.js?v=[0-9]*\|h2x-sum\|h2c-result' | sort | uniq -c ;;
              # The NFL Worker: public routes only (picks are public once locked).
              https://liftr-nfl.jhs797.workers.dev/*)
                curl -sS --max-time 60 "$p" | head -c 20000 ;;
              *)
                curl -sS --max-time 90 "https://liftr-ai.jhs797.workers.dev$p" | head -c 8000 ;;
            esac
            echo
          done < probe/request.txt
