    return `<div class="sd-scrim" data-sd-close="1"></div><form class="sd-sheet" data-sd-form="1">
      <div class="sd-sh"><b>New graphic</b><button type="button" class="ib" data-sd-close="1" aria-label="Close">${ICONS.x}</button></div>
      <label>Kind<select name="category">${sd.types.map((t) => `<option value="${esc(t.id)}"${t.id === g.category ? " selected" : ""}>${esc(t.label)}</option>`).join("")}</select></label>
      ${type ? `<p class="sd-blurb">${esc(type.blurb)}</p>` : ""}
      <label>Team<select name="teamId">${sd.teams.length ? sd.teams.map((t) => `<option value="${t.id}"${String(t.id) === String(g.teamId) ? " selected" : ""}>${esc(t.name)}</option>`).join("") : `<option value="">This week's slate didn't load</option>`}</select></label>
      <div class="sd-two"><label><span>Mascot <i>optional</i></span><input name="mascot" maxlength="40" placeholder="tiger" value="${esc(g.mascot || "")}"></label>
      <label><span>Colors <i>optional</i></span><input name="colors" maxlength="60" placeholder="purple and gold" value="${esc(g.colors || "")}"></label></div>
      <label><span>Art direction <i>optional</i></span><textarea name="feedback" maxlength="300" rows="2" placeholder="Snarling, gold glow, facing left">${esc(g.feedback || "")}</textarea></label>
      <div class="sd-cost">About ${money$(type?.estCost)} · ${sd.budget ? `${money$(sd.budget.left)} left of ${money$(sd.budget.cap)} this month` : ""}</div>
      ${g.msg ? `<div class="sd-msg${g.bad ? " bad" : ""}">${esc(g.msg)}</div>` : ""}
      <button type="submit" class="sd-go"${g.busy ? " disabled" : ""}>${g.busy ? "Sending…" : "Generate"}</button>
      <p class="sd-fine">Nothing is published. It lands here for your review.</p>
    </form>`;
  }
  function paintStudio() {
    if (st.view !== "studio") return;
    const b = sd.budget, used = b && b.cap ? Math.min(100, ((b.spent + b.reserved) / b.cap) * 100) : 0;
    const counts = Object.fromEntries(SD_FILTERS.map(([k]) => [k, k === "ALL" ? sd.items.length : sd.items.filter((x) => x.status === k).length]));
    const list = sd.filter === "ALL" ? sd.items : sd.items.filter((x) => x.status === sd.filter);
    const z = sd.zoom && sd.items.find((x) => x.id === sd.zoom);
    studioEl.innerHTML = `
      <div class="top"><div class="top-in">
        <button type="button" class="brand" data-sd-back="sec-now" aria-label="Back to live"><i class="beat"></i><b>BROCHIEFS</b><span>STUDIO</span></button>
        <span class="age">${sd.loading ? "loading…" : sd.err ? "can't reach the studio" : ""}</span>
        <div class="tools"><button type="button" class="ib" data-sd-refresh="1" aria-label="Refresh">${ICONS.refresh}</button></div>
      </div></div>
      <div class="sd-page">
        <section class="panel sd-head">
          <div class="sd-title"><span>🎨 CREATIVE STUDIO</span><button type="button" class="sd-new" data-sd-new="1">${ICONS.plus}<span>Generate</span></button></div>
          <div class="sd-budget"><div class="sd-bar"><u style="width:${used.toFixed(1)}%"></u></div><span class="num">${b ? `${money$(b.spent)} spent${b.reserved ? ` · ${money$(b.reserved)} in flight` : ""} · ${money$(b.cap)} cap · ${esc(b.month)}` : "Budget…"}</span></div>
          <div class="sd-filters" role="group" aria-label="Status">${SD_FILTERS.map(([k, lab]) => `<button type="button" class="${sd.filter === k ? "on" : ""}" data-sd-filter="${k}">${lab}${counts[k] ? ` <b>${counts[k]}</b>` : ""}</button>`).join("")}</div>
        </section>
        ${sd.err ? `<div class="sd-errbox">${esc(sd.err)}</div>` : ""}
        ${sdSuggest()}
        ${list.length ? `<div class="sd-grid">${list.map(sdCard).join("")}</div>` : `<div class="sd-empty">${sd.loading ? "Loading…" : sd.items.length ? "Nothing here." : "No graphics yet. Tap Generate to make the first one."}</div>`}
        <p class="sd-foot">Approve keeps it private. Only Publish to app puts it in front of the league, and Unpublish brings the usual logo back.</p>
      </div>
      ${z ? `<div class="sd-zoom" data-sd-unzoom="1"><button type="button" class="ib sd-zx" data-sd-unzoom="1" aria-label="Close">${ICONS.x}</button><div class="sd-zimg"><img src="${imgUrl(z.id)}" alt="${esc(z.label)}"></div><div class="sd-zcap">${esc(z.label)} · ${esc(z.categoryLabel)} · ${money$(z.cost ?? z.estCost)}</div></div>` : ""}
      ${sdSheet()}
      <nav class="tabs" aria-label="Sections">${TABS.map(([id, lab, ic]) => `<button type="button" data-sd-back="${id}">${ICONS[ic]}<span>${lab}</span></button>`).join("")}<button type="button" class="on">${ICONS.studio}<span>Studio${sd.review ? `<b>${sd.review}</b>` : ""}</span></button></nav>`;
  }
  studioEl.addEventListener("click", async (e) => {
    const sg = e.target.closest("[data-sg],[data-sg-all],[data-sg-go],[data-sg-fold]");
    if (sg) {
      if (sg.dataset.sgFold) { sd.suggOpen = !sd.suggOpen; return paintStudio(); }
      const list = sd.sugg?.suggestions || [];
      if (sg.dataset.sg) {
        const g = list.find((x) => String(x.subject.teamId) === sg.dataset.sg), has = g && sdHas(g);
        if (has) { if (has.hasImage) { sd.zoom = has.id; paintStudio(); } return; }
        const id = Number(sg.dataset.sg); sd.pick.has(id) ? sd.pick.delete(id) : sd.pick.add(id); return paintStudio();
      }
      if (sg.dataset.sgAll) { const rows = list.filter((g) => g.replay === (sg.dataset.sgAll === "replay") && !sdHas(g)); const all = rows.every((g) => sd.pick.has(g.subject.teamId)); rows.forEach((g) => all ? sd.pick.delete(g.subject.teamId) : sd.pick.add(g.subject.teamId)); return paintStudio(); }
      if (sg.dataset.sgGo) {
        const go = list.filter((g) => !sdHas(g) && sd.pick.has(g.subject.teamId));
        let n = 0, bad = "";
        for (const g of go) {
          sd.queuing = `${++n}/${go.length}`; paintStudio();
          try { await sdFetch("/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ category: g.category, subject: g.subject }) }); sd.pick.delete(g.subject.teamId); }
          catch (err) { bad = err.message; }
        }
        sd.queuing = false; sd.err = bad; await studioLoad(true); return;
      }
    }
    const act = e.target.closest("[data-act]");
    if (act) return sdAct(act.dataset.act, act.dataset.id);
    const b = e.target.closest("[data-sd-back],[data-sd-refresh],[data-sd-new],[data-sd-filter],[data-zoom],[data-sd-unzoom],[data-sd-close]");
    if (!b) return;
    if (b.dataset.sdBack) return closeStudio(b.dataset.sdBack);
    if (b.dataset.sdRefresh) return studioLoad();
    if (b.dataset.sdFilter) { sd.filter = b.dataset.sdFilter; return paintStudio(); }
    if (b.dataset.zoom) { sd.zoom = b.dataset.zoom; return paintStudio(); }
    if (b.dataset.sdUnzoom) { if (e.target.closest(".sd-zimg img")) { e.target.closest(".sd-zimg").classList.toggle("big"); return; } sd.zoom = null; return paintStudio(); }
    if (b.dataset.sdClose) { sd.gen = null; return paintStudio(); }
    if (b.dataset.sdNew) {
      sd.gen = { category: sd.types[0]?.id || "team-mascot" }; paintStudio();
      await loadTeams(); if (sd.gen && !sd.gen.teamId) sd.gen.teamId = sd.teams[0]?.id; paintStudio();
    }
  });
  studioEl.addEventListener("change", (e) => {
    const f = e.target.closest("[data-sd-form]"); if (!f || !sd.gen) return;
    Object.assign(sd.gen, Object.fromEntries(new FormData(f)));
    if (e.target.name === "category") paintStudio();
  });
  studioEl.addEventListener("submit", async (e) => {
    const f = e.target.closest("[data-sd-form]"); if (!f) return;
    e.preventDefault();
    const g = Object.assign(sd.gen, Object.fromEntries(new FormData(f)));
    const team = sd.teams.find((t) => String(t.id) === String(g.teamId));
    g.busy = true; g.msg = ""; paintStudio();
    try {
      const r = await sdFetch("/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ category: g.category, week: sd.week, feedback: g.feedback, subject: { teamId: team?.id, name: team?.name, mascot: g.mascot, colors: g.colors } }) });
      sd.gen = null; sd.filter = "ALL";
      if (r.existing) sd.err = "";
      await studioLoad(true);
      if (r.existing) { sd.zoom = null; alert(`There's already a ${r.status === "PENDING_REVIEW" ? "version in review" : "version in the works"} for this one. Regenerating comes with review actions.`); }
    } catch (err) { g.busy = false; g.msg = err.message; g.bad = true; paintStudio(); }
  });

  function gate(err = "") {
    st.gated = true;
    clearTimeout(poll.t);
    app.innerHTML = `<form class="gate"><h1>BROCHIEFS LIVE</h1><p>Enter the admin key.</p>
      <input type="text" name="username" value="Brochiefs Live" autocomplete="username" hidden>
      <input type="password" name="password" autocomplete="current-password" placeholder="Admin key" required>
      <label class="rem"><input type="checkbox" checked> Remember this device for 180 days</label>
      <button>Go live</button><div class="err">${esc(err)}</div></form>`;
    const input = app.querySelector('input[type="password"]'), btn = app.querySelector("form button");
    input.focus();
    app.querySelector("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const k = input.value.trim();
      if (app.querySelector('.rem input').checked) {
        btn.disabled = true; btn.textContent = "Checking…";
        const r = await remember(k);
        if (r === 403) { btn.disabled = false; btn.textContent = "Go live"; app.querySelector(".err").textContent = "That key didn't work."; return; }
        if (r !== 200) { key = k; session.set(KEY_STORE, k); } // couldn't reach the Worker: this session only
      } else { key = k; session.set(KEY_STORE, k); }
      start();
    });
  }
  function start() {
    st.gated = false; st.known = null; st.sig = "";
    // The last view straight away, marked as refreshing, then the real one.
    try {
      const snap = JSON.parse(store.get(SNAP_STORE) || "null");
      if (snap?.room) { st.room = snap.room; st.names = snap.names || []; st.seen = snap.seen || {}; st.games = snap.games || {}; st.asks = snap.asks || []; st.cached = true; }
    } catch {}
    render();
    poll(true);
    keepAwake();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && (device || key) && !st.gated) { keepAwake(); poll(false); checkVersion(); } });

  // New versions: a home screen app has no reload, so this page compares
  // itself with the copy on the site now and then and on coming back, and
  // reloads onto a new one (never while a preview is open). Tapping the
  // title reloads too.
  let mine = null;
  async function checkVersion() {
    try {
      const text = await (await fetch(`./?t=${Date.now()}`, { cache: "no-store" })).text();
      let h = 7; for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
      if (mine === null) mine = h;
      else if (h !== mine && !st.pv && !document.hidden) location.reload();
    } catch {}
  }
  checkVersion();
  setInterval(() => { if (!document.hidden) checkVersion(); }, 5 * 60000);
  // A key saved by the first version of this page is traded for a device
  // token, then dropped.
  const oldKey = store.get(KEY_STORE);
  if (oldKey && !device) { store.del(KEY_STORE); remember(oldKey).then((r) => { if (r === 200) start(); else if (r === 403) gate(); else { key = oldKey; session.set(KEY_STORE, oldKey); start(); } }); }
  else if (device || key) start(); else gate();
})();
</script>
</body>
</html>
