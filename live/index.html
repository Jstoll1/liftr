<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0716">
<title>Brochiefs Live</title>
<!-- A home screen app on iPhone and iPad; the desktop layout from 880px. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://liftr-ai.jhs797.workers.dev" crossorigin>
<style>
/* The admin's watch panel: who is in the app now, the last 24 hours on
   one timeline, and every visit with what was done in it. System fonts
   and no libraries, so it paints at once; the last view is drawn from
   this device straight away and replaced when the Worker answers. */
:root {
  --bg: #0b0716; --panel: #140e24; --panel2: #1b1430; --line: #2a2140; --line2: #3a2f58;
  --text: #f3efff; --meta: #b8afd3; --dim: #8a80a8;
  --green: #3dfc8f; --green-bg: rgba(61, 252, 143, .09); --cyan: #4fe3f0; --gold: #ffe45e;
  /* Chart marks, checked against the panel surface: past visits violet,
     live ones green (live also carries a label). */
  --past: #8b6cff; --live: #1fae5c;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh;
  background: radial-gradient(1100px 520px at 78% -12%, rgba(139, 108, 255, .16), transparent 70%), radial-gradient(800px 420px at -8% 4%, rgba(61, 252, 143, .07), transparent 70%), var(--bg); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: linear-gradient(rgba(139, 108, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(139, 108, 255, .06) 1px, transparent 1px); background-size: 44px 44px;
  -webkit-mask-image: linear-gradient(#000, transparent 70%); mask-image: linear-gradient(#000, transparent 70%); }
#app { position: relative; z-index: 1; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 5; background: rgba(11, 7, 22, .82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(139, 108, 255, .7), rgba(61, 252, 143, .7), transparent); }
.top-in { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); }
.brand { padding: 0; background: none; border: 0; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; gap: 9px; font: 800 14px/1 var(--mono); letter-spacing: .16em; }
.brand b { color: var(--gold); text-shadow: 0 0 14px rgba(255, 228, 94, .35); }
.brand span { color: var(--green); text-shadow: 0 0 14px rgba(61, 252, 143, .45); }
.beat { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: beat 1.6s ease-in-out infinite; }
.top.stale .beat { background: #ffb347; box-shadow: 0 0 10px #ffb347; }
@keyframes beat { 50% { opacity: .3; } }
.age { font: 12px var(--mono); color: var(--dim); }
.tools { margin-left: auto; display: flex; gap: 6px; }
.tool { padding: 6px 11px; font-size: 13px; color: var(--meta); background: rgba(255, 255, 255, .02); border: 1px solid var(--line); border-radius: 8px; white-space: nowrap; }
.tool:hover { color: var(--text); border-color: var(--line2); }
.tool.on { color: var(--green); border-color: rgba(61, 252, 143, .5); }
@media (max-width: 560px) { .age { display: none; } .tool { padding: 6px 9px; font-size: 12.5px; } }

/* Refresh and menu */
.ib { display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 0; color: var(--meta); background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 10px; -webkit-tap-highlight-color: transparent; }
.ib svg { width: 19px; height: 19px; }
.ib:hover, .ib.on { color: var(--text); border-color: var(--line2); background: rgba(255, 255, 255, .06); }
.ib.spin svg { animation: spin .7s linear infinite; color: var(--green); }
@keyframes spin { to { transform: rotate(360deg); } }
.tools { position: relative; }
.menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; min-width: 250px; padding: 6px; border-radius: 14px; background: rgba(24, 17, 42, .98); border: 1px solid var(--line2); box-shadow: 0 18px 50px rgba(0, 0, 0, .55); animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.menu button, .menu a { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 10px; font-size: 14px; color: var(--text); text-align: left; text-decoration: none; background: none; border: 0; border-radius: 9px; }
.menu button:hover, .menu a:hover { background: rgba(255, 255, 255, .06); }
.menu svg { width: 18px; height: 18px; flex: none; color: var(--meta); }
.menu span { flex: 1; }
.menu i { font-style: normal; font-size: 12px; color: var(--dim); }
.menu i.on { font: 700 10px/1 var(--mono); padding: 3px 6px; border-radius: 6px; color: #0b0716; background: var(--green); }
.menu hr { margin: 6px 4px; border: 0; border-top: 1px solid var(--line); }
.menu .danger, .menu .danger svg { color: #ff8aa8; }

/* Section tabs: a bottom tab bar on a phone, centred in the top bar on a
   wide screen. Outside the top bar so "fixed" means the screen. */
.tabs { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; display: flex; padding: 6px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: rgba(11, 7, 22, .9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 2px; font-size: 11px; font-weight: 600; color: var(--dim); background: none; border: 0; -webkit-tap-highlight-color: transparent; }
.tabs svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--green); }
.tabs button.on svg { filter: drop-shadow(0 0 6px rgba(61, 252, 143, .6)); }
.tabs span { display: inline-flex; align-items: center; gap: 4px; }
.tabs span b { min-width: 16px; padding: 1px 4px; border-radius: 8px; font: 700 10px/1.3 var(--mono); color: #0b0716; background: var(--green); }
@media (min-width: 1024px) {
  .tabs { top: max(11px, env(safe-area-inset-top)); bottom: auto; left: 50%; right: auto; transform: translateX(-50%); padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .03); backdrop-filter: none; -webkit-backdrop-filter: none; z-index: 6; }
  .tabs button { flex-direction: row; gap: 7px; padding: 7px 14px; font-size: 13px; border-radius: 9px; }
  .tabs svg { width: 16px; height: 16px; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); background: rgba(139, 108, 255, .2); box-shadow: inset 0 0 0 1px rgba(139, 108, 255, .45); }
  .tabs button.on svg { color: var(--green); }
}
body.pv-open .tabs { display: none; }

/* Page */
.page { max-width: 1440px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "kpi" "tl" "feed" "rail"; }
@media (min-width: 1024px) { .page { padding-bottom: calc(48px + env(safe-area-inset-bottom)); grid-template-columns: minmax(0, 1fr) 330px; grid-template-areas: "kpi kpi" "tl tl" "feed rail"; align-items: start; } .rail { position: sticky; top: 76px; } }
@media (min-width: 1100px) { body.pv-open .page { margin-right: 430px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "kpi" "tl" "feed" "rail"; } body.pv-open .rail { position: static; } }
.kpis, .tl, .feed, .rail { scroll-margin-top: 84px; }
.kpis { grid-area: kpi; } .tl { grid-area: tl; } .feed { grid-area: feed; min-width: 0; } .rail { grid-area: rail; display: flex; flex-direction: column; gap: 16px; }
.panel { position: relative; padding: 14px 16px 16px; border-radius: 16px; background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .012)), var(--panel); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 10px 30px rgba(0, 0, 0, .25); }
.ph { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 12px; }
.ph h2 { margin: 0; font: 700 11.5px/1 var(--mono); letter-spacing: .16em; color: var(--meta); text-transform: uppercase; }
.ph .sub { font-size: 12px; color: var(--dim); }
.ph .end { margin-left: auto; }
.key { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.key i { width: 14px; height: 8px; border-radius: 3px; background: var(--past); }
.key i.lv { background: var(--live); box-shadow: 0 0 8px rgba(61, 252, 143, .6); }

/* Headline numbers: a slim "in now" banner, then one compact panel of six. */
.kpis { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) { .kpis { grid-template-columns: minmax(280px, 1fr) minmax(0, 2.6fr); align-items: stretch; } }
.kpi.now { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; padding: 12px 16px; border-radius: 14px; background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .01)), var(--panel); border: 1px solid rgba(61, 252, 143, .22); }
.kpi.now.on { border-color: rgba(61, 252, 143, .55); background: radial-gradient(240px 120px at 0% 0%, rgba(61, 252, 143, .16), transparent), linear-gradient(180deg, rgba(61, 252, 143, .06), rgba(61, 252, 143, .01)), var(--panel); box-shadow: 0 0 30px rgba(61, 252, 143, .12); }
.now-l { display: flex; align-items: baseline; gap: 8px; flex: none; }
.now-l b { font: 800 30px/1 var(--mono); color: var(--text); }
.kpi.now.on .now-l b { color: var(--green); text-shadow: 0 0 18px rgba(61, 252, 143, .45); }
.now-l em { font: 700 11px/1 var(--mono); letter-spacing: .14em; color: var(--dim); font-style: normal; text-transform: uppercase; }
.now-last { font-size: 13.5px; color: var(--meta); }
.now-last b { color: var(--text); }
.kpi.now .avs { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.inp { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 2px; border-radius: 999px; background: rgba(61, 252, 143, .1); border: 1px solid rgba(61, 252, 143, .35); font-size: 13px; font-weight: 600; }
.inp small { font: 600 11px var(--mono); color: var(--green); }
.kstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 14px; background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .01)), var(--panel); border: 1px solid var(--line); overflow: hidden; }
@media (min-width: 1024px) { .kstats { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.ks { min-width: 0; display: flex; flex-direction: column; padding: 11px 12px 10px; border-right: 1px solid rgba(255, 255, 255, .05); border-bottom: 1px solid rgba(255, 255, 255, .05); cursor: default; }
.ks[data-tip]:hover { background: rgba(255, 255, 255, .03); }
.ks em { display: block; font: 700 9.5px/1.2 var(--mono); letter-spacing: .12em; color: var(--dim); font-style: normal; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ks b { display: block; margin-top: 5px; font: 800 21px/1 var(--mono); color: var(--text); letter-spacing: -.01em; }
.ks b small { font-size: 12px; color: var(--dim); font-weight: 700; margin-left: 1px; }
.ks span { display: block; min-height: 1.2em; margin-top: 5px; font-size: 11.5px; color: var(--meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Avatars */
.av { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--c); color: #0b0716; font: 800 13px/1 system-ui, sans-serif; position: relative; }
.av.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 11px; }
.av.lg { width: 38px; height: 38px; border-radius: 11px; font-size: 17px; }
.av.on::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--green); border: 2px solid var(--panel); box-shadow: 0 0 8px var(--green); }
.av.sm.on::after { right: -3px; bottom: -3px; width: 8px; height: 8px; border-width: 1.5px; }

/* The timeline: a lane per player over the last 24 hours, a block per
   visit. Lane names filter the feed; a block jumps to its visit. */
.tl-grid { position: relative; display: grid; grid-template-columns: var(--lab) minmax(0, 1fr); --lab: 148px; row-gap: 4px; }
@media (max-width: 640px) { .tl-grid { --lab: 112px; } .ln-l { gap: 6px; } .ln-l .nm { font-size: 13px; } }
.ln-l { display: flex; align-items: center; gap: 8px; min-width: 0; height: 34px; padding: 0 8px 0 4px; margin-right: 8px; text-align: left; background: none; border: 1px solid transparent; border-radius: 9px; }
.ln-l:hover { background: rgba(255, 255, 255, .04); }
.ln-l.sel { background: rgba(139, 108, 255, .14); border-color: rgba(139, 108, 255, .45); }
.ln-l .t { min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.ln-l .nm { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln-l .st { font: 11px var(--mono); color: var(--dim); white-space: nowrap; }
.ln-l.in .st { color: var(--green); }
.ln-l.idle .nm { color: var(--dim); }
.ln-t { position: relative; height: 34px; border-radius: 8px; background: rgba(255, 255, 255, .025); }
.ln-t.sel { background: rgba(139, 108, 255, .08); }
.tl-over { position: absolute; top: 26px; bottom: 0; left: var(--lab); right: 0; pointer-events: none; }
.tl-over .night { position: absolute; top: 0; bottom: 0; background: rgba(0, 0, 0, .22); }
.tl-over .hr { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .05); }
.tl-over .hr.mid { background: rgba(255, 255, 255, .14); }
.tl-over .now { position: absolute; top: -8px; bottom: 0; right: 0; width: 2px; background: var(--green); box-shadow: 0 0 10px var(--green); }
.blk { position: absolute; top: 7px; height: 20px; min-width: 6px; border-radius: 5px; background: var(--past); box-shadow: 0 0 0 1px rgba(11, 7, 22, .6); cursor: pointer; transition: filter .15s, transform .15s; }
.blk:hover { filter: brightness(1.25); transform: scaleY(1.12); }
.blk.live { background: linear-gradient(90deg, var(--live), #3dfc8f); box-shadow: 0 0 14px rgba(61, 252, 143, .55); }
.blk.live { animation: livepulse 1.6s ease-in-out infinite; }
/* How long they were really in: a dot for a quick look, a short bar under
   five minutes, the full bar past that. */
.blk.peek { top: 12px; height: 10px; min-width: 10px; border-radius: 5px; opacity: .75; }
.blk.short { top: 10px; height: 14px; min-width: 10px; }
@keyframes livepulse { 50% { box-shadow: 0 0 22px rgba(61, 252, 143, .85); } }
.blk.focus { outline: 2px solid #fff; outline-offset: 1px; }
.tl-ax { grid-column: 2; position: relative; height: 22px; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.tl-ax span { position: absolute; top: 3px; transform: translateX(-50%); font: 11px var(--mono); color: var(--dim); white-space: nowrap; }
.tl-ax span.nowl { transform: translateX(-100%); color: var(--green); font-weight: 700; }

/* Range switch */
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255, 255, 255, .03); }
.ph .seg { margin-left: auto; }
.ph .key + .seg { margin-left: 12px; }
.seg button { padding: 4px 10px; font: 600 12px/1.2 var(--mono); color: var(--dim); background: none; border: 0; border-radius: 7px; }
.seg button.on { color: var(--text); background: rgba(139, 108, 255, .25); box-shadow: inset 0 0 0 1px rgba(139, 108, 255, .5); }
.tl-hint { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin: -2px 0 10px; font-size: 11.5px; color: var(--dim); }
.ln-l.quiet { opacity: .45; }
.ln-t.quiet { background: rgba(255, 255, 255, .018); }
.sub2 { margin: 0 0 8px; font: 600 11px/1.3 var(--mono); letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }

/* The week: when in the day, a punch card */
.pc { display: grid; grid-template-columns: var(--lab, 148px) repeat(24, minmax(0, 1fr)); gap: 3px; align-items: center; }
@media (max-width: 640px) { .pc { --lab: 64px; gap: 2px; } }
.pc-c { max-height: 30px; }
.pc-l { display: flex; flex-direction: column; line-height: 1.1; padding-right: 6px; }
.pc-l b { font-size: 13px; }
.pc-l small { font: 10.5px var(--mono); color: var(--dim); }
.pc-l.t b { color: var(--green); }
.pc-c { position: relative; aspect-ratio: 1; max-height: 26px; display: grid; place-items: center; border-radius: 4px; background: rgba(255, 255, 255, .025); font-style: normal; }
.pc-c s { display: block; width: 0; height: 0; border-radius: 50%; background: var(--past); text-decoration: none; }
.pc-c[data-tip]:hover s { filter: brightness(1.3); }
.pc-c.now { box-shadow: inset 0 0 0 1.5px var(--green); }
.pc-c.fut { background: none; }
.pc-x { font: 10px var(--mono); color: var(--dim); white-space: nowrap; overflow: visible; }
.pc > span:nth-last-child(-n+24) { padding-top: 4px; }
.sub2.row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
.sub2.row .seg { margin-left: auto; }
.seg.sm button { padding: 3px 8px; font-size: 11px; letter-spacing: 0; text-transform: none; }

/* The week: who by day */
.hm { display: grid; grid-template-columns: var(--lab, 148px) repeat(7, minmax(0, 1fr)); gap: 4px; align-items: center; }
@media (max-width: 640px) { .hm { --lab: 112px; gap: 3px; } }
.hm-h { text-align: center; font: 600 11px/1.2 var(--mono); color: var(--dim); text-transform: uppercase; }
.hm-h small { display: block; font-size: 10px; opacity: .7; }
.hm-h.t { color: var(--green); }
.hm-c { height: 34px; display: grid; place-items: center; border-radius: 7px; font: 700 11.5px var(--mono); font-style: normal; color: #fff; background: rgba(255, 255, 255, .03); cursor: default; transition: filter .15s, opacity .15s; }
.hm-c.z { color: transparent; }
.hm-c:hover { filter: brightness(1.25); }
.hm-c.dim { opacity: .25; }
@media (max-width: 640px) { .hm-c { font-size: 10px; } }
.ln-l.dl { cursor: default; }
.ln-l.dl:hover { background: none; }
.ln-l.dl.in .nm { color: var(--green); }
.blk.wk { opacity: .85; }
.nowtick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--green); box-shadow: 0 0 8px var(--green); }

/* Feed */
.fh { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 4px; }
.fh h2 { margin: 0; font: 700 11.5px/1 var(--mono); letter-spacing: .16em; color: var(--meta); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; font-size: 13px; background: rgba(139, 108, 255, .14); border: 1px solid rgba(139, 108, 255, .45); border-radius: 999px; }
.chip button { padding: 0 6px; color: var(--meta); background: none; border: 0; font-size: 13px; }
.day { margin: 18px 0 8px; font: 700 11px/1 var(--mono); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sess { position: relative; margin-bottom: 10px; border-radius: 14px; background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .01)), var(--panel); border: 1px solid var(--line); overflow: hidden; }
.sess::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--past); opacity: .8; }
.sess.live { border-color: rgba(61, 252, 143, .45); background: radial-gradient(400px 140px at 0% 0%, rgba(61, 252, 143, .1), transparent), var(--panel); }
.sess.live::before { background: var(--green); box-shadow: 0 0 12px var(--green); opacity: 1; }
.sess.fresh { animation: arrive 2s ease-out; }
.sess.focus { animation: focus 1.8s ease-out; }
@keyframes arrive { from { box-shadow: 0 0 0 2px var(--green), 0 0 28px rgba(61, 252, 143, .45); } }
@keyframes focus { from { box-shadow: 0 0 0 2px #fff, 0 0 26px rgba(139, 108, 255, .6); } }
.sh { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; }
.sh .who { min-width: 0; }
.sh .nm { font-size: 16px; font-weight: 700; }
.sh .meta { font-size: 13px; color: var(--meta); }
.sh-r { margin-left: auto; flex: none; display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; }
@media (max-width: 560px) { .sh-r { flex-direction: column; align-items: flex-end; gap: 2px; } }
/* Copy: a quiet icon until it's wanted. The tap area stays 32px. */
.cp { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 32px; min-height: 32px; padding: 0 6px; font-size: 12px; font-weight: 600; color: var(--dim); background: none; border: 0; border-radius: 8px; opacity: .55; transition: opacity .15s, color .15s, background .15s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.cp svg { width: 15px; height: 15px; }
.cp:hover, .cp:focus-visible { opacity: 1; color: var(--meta); background: rgba(255, 255, 255, .05); outline: none; }
.sess:hover .cp { opacity: .85; }
.cp:active { transform: scale(.94); }
.cp.ok { opacity: 1; color: var(--green); }
.fh .cp { margin-left: auto; }
.badge { flex: none; padding: 4px 9px; border-radius: 999px; font: 700 12px/1 var(--mono); }

.sess:not(.live) .badge { color: var(--meta); background: var(--panel2); }
.acts { margin: 0; padding: 4px 14px 10px 66px; list-style: none; border-top: 1px solid var(--line); }
.acts li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 5px 0; font-size: 14px; }
.acts li + li { border-top: 1px solid rgba(255, 255, 255, .04); }
.acts time { color: var(--dim); font: 12px var(--mono); padding-top: 2px; }
.acts em { font-style: normal; color: var(--cyan); }
.acts .x { color: var(--dim); font-size: 12.5px; }
.acts li.new { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 30% { background: rgba(61, 252, 143, .14); } }
.acts .quiet { color: var(--dim); font-size: 13px; }
@media (max-width: 560px) { .acts { padding-left: 16px; } }
.more { display: block; padding: 0 14px 12px 66px; font-size: 13px; color: var(--cyan); background: none; border: 0; text-align: left; }
.empty { padding: 18px; border-radius: 14px; border: 1px dashed var(--line); color: var(--dim); }
.older { margin-top: 4px; padding: 10px 14px; width: 100%; color: var(--cyan); background: none; border: 1px solid var(--line); border-radius: 12px; }
.note { margin: 6px 0 0; font-size: 12.5px; color: var(--dim); }

/* Lines that open a preview */
.acts li.go { cursor: pointer; border-radius: 8px; margin: 0 -8px; padding: 5px 8px; }
.acts li.go:hover, .acts li.go:focus-visible { background: rgba(79, 227, 240, .08); outline: none; }
.acts li.go.on { background: rgba(79, 227, 240, .14); box-shadow: inset 2px 0 0 var(--cyan); }
.acts li .peek { margin-left: 8px; font-style: normal; font-size: 11px; color: var(--dim); opacity: 0; transition: opacity .15s; }
.acts li.go:hover .peek, .acts li.go.on .peek { opacity: 1; color: var(--cyan); }
@media (hover: none) { .acts li .peek { opacity: .7; } }

/* Rail charts */
.bars { display: flex; align-items: flex-end; gap: 2px; height: 110px; padding-top: 6px; }
.bars i { position: relative; flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; cursor: default; }
.bars i b { display: block; width: 100%; min-height: 2px; border-radius: 4px 4px 1px 1px; background: var(--past); }
.bars i.zero b { background: rgba(255, 255, 255, .08); }
.bars i.cur b { background: linear-gradient(180deg, #b9a6ff, var(--past)); box-shadow: 0 0 12px rgba(139, 108, 255, .6); }
.bars i:hover b { filter: brightness(1.3); }
.bars-ax { display: flex; justify-content: space-between; margin-top: 6px; font: 11px var(--mono); color: var(--dim); }
.rank { display: flex; flex-direction: column; gap: 8px; }
.rank div { display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 4px 10px; align-items: center; font-size: 13px; }
.rank div span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank div b { text-align: right; font: 700 13px var(--mono); color: var(--meta); }
.rank div i { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.rank div i s { display: block; height: 100%; border-radius: 3px; background: var(--past); text-decoration: none; }
.split { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; }
.split s { display: block; height: 100%; text-decoration: none; }
.split-k { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--meta); }
.split-k b { font-family: var(--mono); color: var(--text); }
.split-k i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Tooltip */
.tip { position: fixed; z-index: 30; pointer-events: none; max-width: 260px; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.4; color: var(--text); background: rgba(20, 14, 36, .97); border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); opacity: 0; transition: opacity .12s; }
.tip.show { opacity: 1; }
.tip b { display: block; font-size: 13px; }

/* The preview panel: a phone-width frame at the right on a wide screen,
   a full screen sheet on a narrow one. */
/* A sheet from the bottom on a phone (drag it down, tap behind it, or
   Done to close), a floating panel on a tablet, a side panel on a wide
   screen. The page stays in view behind the first two. */
.pv, .pv-back { display: none; }
body.pv-open .pv-back { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(3, 0, 8, .62); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); animation: fadein .2s ease-out; }
@keyframes fadein { from { opacity: 0; } }
body.pv-open .pv { display: flex; flex-direction: column; position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: min(86vh, 900px); background: #0d0919; border-top: 1px solid var(--line2); border-radius: 20px 20px 0 0; box-shadow: 0 -20px 60px rgba(0, 0, 0, .6); animation: sheetup .28s cubic-bezier(.22, 1, .36, 1); }
@keyframes sheetup { from { transform: translateY(100%); } }
@media (max-width: 1099px) { body.pv-open { overflow: hidden; } }
@media (min-width: 700px) { body.pv-open .pv { left: auto; top: max(12px, env(safe-area-inset-top)); right: 12px; bottom: 12px; width: 430px; height: auto; border: 1px solid var(--line2); border-radius: 20px; animation: pop .18s ease-out; } }
@media (min-width: 1100px) {
  body.pv-open .pv-back { display: none; }
  body.pv-open .pv { top: 61px; right: 0; bottom: 0; border: 0; border-left: 1px solid var(--line); border-radius: 0; box-shadow: none; }
}
.pv-grab { display: flex; justify-content: center; padding: 8px 0 2px; touch-action: none; cursor: grab; }

.pv-done { flex: none; min-height: 36px; padding: 0 14px; font-weight: 700; font-size: 14px; color: #0b0716; background: var(--green); border: 0; border-radius: 10px; }

.cb { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; }

/* Key */

.sd-acts .no { flex: 0 0 auto; padding: 9px 12px; color: #ff6b93; }
.sd-live { flex: 1; font: 700 11.5px var(--mono); color: var(--green); }
.sd-wait { font: 12px var(--mono); color: var(--meta); }
.sd-card.s-published { border-color: rgba(61, 252, 143, .55); box-shadow: 0 0 18px rgba(61, 252, 143, .18); }
</style>
</head>
<body>
<div id="app"></div>
<div id="studio" hidden></div>
<div class="pv-back" id="pv-back"></div>
<aside id="pv" class="pv" aria-label="Preview" role="dialog"></aside>
<div id="tip" class="tip" role="tooltip"></div>
<script>
(() => {
  const WORKER = "https://liftr-ai.jhs797.workers.dev";
  // Signed in either as a remembered device (a token the Worker signed,
  // kept on this computer for 180 days) or with the key for this browser
  // session only. The key itself is never kept.
  const KEY_STORE = "brochiefs_live_key", DEVICE_STORE = "brochiefs_live_device", SNAP_STORE = "brochiefs_live_snap";
  const COLORS = ["#ff4f9a", "#ffe45e", "#c77dff", "#ffb347", "#3dfc8f", "#ff6b6b", "#4fe3f0", "#7aa2ff", "#9cf27a", "#ff9d3d"];
  const SHOWN = { Conlan: "Connie" };
  const SCREENS = { picks: "Picks", scoreboard: "Scores", history: "History", trivia: "Trivia", home: "Home", roster: "the roster", splash: "the splash screen" };
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
  const session = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: (k) => { try { sessionStorage.removeItem(k); } catch {} } };
  let device = store.get(DEVICE_STORE) || "", key = session.get(KEY_STORE) || "";
  const auth = () => (device ? `device=${encodeURIComponent(device)}` : `key=${encodeURIComponent(key)}`);
  async function remember(k) {
    try {
      const r = await fetch(`${WORKER}/presence-device?key=${encodeURIComponent(k)}`, { method: "POST", cache: "no-store" });
      if (!r.ok) return r.status;
      device = (await r.json()).token || "";
      if (device) store.set(DEVICE_STORE, device);
      return device ? 200 : 500;
    } catch { return 0; }
  }
  function forget() { device = ""; key = ""; store.del(DEVICE_STORE); store.del(KEY_STORE); store.del(SNAP_STORE); session.del(KEY_STORE); }

  // room: the Worker's answer. names, seen, games: the once-a-minute extras.
  const st = { metric: store.get("brochiefs_live_metric") === "min" ? "min" : "visits", asks: [], range: ["3h", "6h", "12h", "24h", "7d"].includes(store.get("brochiefs_live_range")) ? store.get("brochiefs_live_range") : "6h", wk: null, sec: "sec-now", menu: false, refreshing: false, focus: null, texts: new Map(), copied: null, pv: null, room: null, names: [], seen: {}, games: {}, at: 0, ok: true, cached: false, known: null, fresh: new Set(), filter: null, open: new Set(), shown: 20, alert: false, wake: null, gated: false, sig: "" };

  // --- Formatting --------------------------------------------------------
  const name = (n) => SHOWN[n] || n;
  const color = (n) => COLORS[[...n].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % COLORS.length];
  const av = (n, size, on) => `<span class="av${size ? ` ${size}` : ""}${on ? " on" : ""}" style="--c:${color(n)}">${esc(name(n)[0])}</span>`;
  const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}:${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : `${m}:${String(s % 60).padStart(2, "0")}`; };
  const dur = (ms) => ms < 60000 ? `${Math.max(1, Math.round(ms / 1000))}s` : ms < 3600000 ? `${Math.round(ms / 60000)} min` : `${(ms / 3600000).toFixed(1)} hr`;
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
  const hm = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const dayOf = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const dayLab = (t) => { const d = dayOf(t), today = dayOf(Date.now()); return d === today ? "Today" : d === today - 86400000 ? "Yesterday" : new Date(t).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }); };
  const nameFrom = (slug) => st.names.find((n) => n.toLowerCase() === slug) || slug.charAt(0).toUpperCase() + slug.slice(1);
  const evId = (e) => `${e.n}|${e.at}|${e.k}`;

  // One action in plain words, with its detail (a game, a person) apart.
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICONS = {
    refresh: svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
    more: svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'),
    bell: svg('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
    copy: svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
    app: svg('<rect x="6" y="3" width="12" height="18" rx="3"/><path d="M11 17h2"/>'),
    console: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>'),
    out: svg('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/>'),
    now: svg('<circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>'),
    tl: svg('<path d="M4 6h7M8 12h10M4 18h12"/><path d="M20 4v16"/>'),
    visits: svg('<rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/>'),
    stats: svg('<path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/>'),
    studio: svg('<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.4-1.9-.4-1 .3-2.1 1.4-2.1H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  };
  const TABS = [["sec-now", "Now", "now"], ["sec-tl", "Timeline", "tl"], ["sec-visits", "Visits", "visits"], ["sec-stats", "Stats", "stats"]];
  // Which section is in view, for the tabs; recomputed on scroll and after
  // every redraw, so the right tab stays lit.
  function paintTabs() {
    if (Date.now() < (st.secLock || 0)) return;
    // A section that sits beside the one before it (Stats next to Visits on
    // a wide screen) doesn't take over from it.
    let cur = "sec-now", prevTop = null;
    for (const [id] of TABS) {
      const el = document.getElementById(id); if (!el) continue;
      const top = el.getBoundingClientRect().top;
      if (top < 140 && (prevTop === null || Math.abs(top - prevTop) > 8)) cur = id;
      prevTop = top;
    }
    const stats = document.getElementById("sec-stats"), feed = document.getElementById("sec-visits");
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4 && stats && feed && stats.getBoundingClientRect().top > feed.getBoundingClientRect().top + 8) cur = "sec-stats";
    if (cur !== st.sec) { st.sec = cur; document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.sec === cur)); }
  }
  addEventListener("scroll", () => { cancelAnimationFrame(paintTabs.r); paintTabs.r = requestAnimationFrame(paintTabs); }, { passive: true });
  const COPY_ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>`;
  const SAYS = {
    "game-info": "Opened game info", gamecast: "Watched the live game cast", "game-final": "Opened a final recap",
    "scorebug-open": "Tapped a score", "ranking-expand": "Opened a leaderboard card",
    "path-share": "Shared a Path to Win", "path-intro": "Saw the Path to Win intro",
    "wp-player": "Opened a win % breakdown", "wp-explain": "Read how win % works", h2h: "Opened head to head",
    "pot-open": "Opened the pot", "all-picks-open": "Opened everyone's picks", "pick-saved": "Saved a pick", "pick-updated": "Changed a pick",
    sim: "Ran a game sim", "grid-card": "Opened a grid card", "history-ask": "Asked the archive", "gamecast-log": "Opened the full game log",
  };
  function says(e, feed) {
    if (e.k === "path-run" || e.k === "path-card") {
      const of = feed.find((x) => x.n === e.n && /^path-of-/.test(x.k) && Math.abs(x.at - e.at) < 3000);
      return [e.k === "path-run" ? "Ran Path to Win" : "Opened a Path to Win card", of ? `for ${name(nameFrom(of.k.slice(8)))}` : ""];
    }
    if (SAYS[e.k]) return [SAYS[e.k], /^(game-|gamecast|scorebug)/.test(e.k) ? st.games[e.d] || "" : e.k === "ranking-expand" && e.d ? name(e.d) : e.k === "history-ask" && e.d ? `“${e.d}”` : ""];
    if (SCREENS[e.k]) return [`Went to ${SCREENS[e.k]}`, ""];
    return [e.k.charAt(0).toUpperCase() + e.k.slice(1).replace(/-/g, " "), ""];
  }

  // Where a line opens in the preview: a view of the app, or null.
  function target(e, feed) {
    if (/^(game-info|gamecast|gamecast-log|game-final|scorebug-open)$/.test(e.k) && e.d) return `game&x=${encodeURIComponent(e.d)}`;
    if (e.k === "ranking-expand" && e.d) return `card&x=${encodeURIComponent(e.d)}`;
    if (e.k === "path-run" || e.k === "path-card") {
      const of = feed.find((x) => x.n === e.n && /^path-of-/.test(x.k) && Math.abs(x.at - e.at) < 3000);
      return of ? `path&x=${encodeURIComponent(nameFrom(of.k.slice(8)))}` : "scoreboard";
    }
    if (e.k === "h2h") return "h2h";
    if (e.k === "history-ask") return "ask";
    if (e.k === "history" || e.k === "trivia" || e.k === "scoreboard") return e.k;
    if (e.k === "picks" || /^pick-/.test(e.k)) return "picks";
    if (/^(pot-open|all-picks-open|wp-player|wp-explain|sim|grid-card|path-intro|path-share)$/.test(e.k)) return "scoreboard";
    return null;
  }

  // The feed as visits: each "in" starts one, an "out" ends it; uses in
  // between are its lines, oldest first. Visits newest first.
  function visits(feed, people) {
    const open = {}, list = [];
    for (const e of feed.filter((x) => !/^path-of-/.test(x.k)).slice().reverse()) {
      let s = open[e.n];
      if (e.k === "in" || !s) {
        s = open[e.n] = { n: e.n, start: e.at, end: e.at, app: e.k === "in" ? e.d : "", acts: [], done: false };
        list.push(s);
        if (e.k === "in") continue;
      }
      if (e.k === "out") { s.end = e.at; s.done = true; delete open[e.n]; continue; }
      const last = s.acts[s.acts.length - 1];
      const [a, d] = says(e, feed);
      if (last && last.a === a && last.d === d) { last.x++; last.ids.push(evId(e)); } else s.acts.push({ at: e.at, a, d, x: 1, ids: [evId(e)], go: target(e, feed) });
      s.end = e.at;
    }
    for (const s of Object.values(open)) { const p = people[s.n]; if (p?.in && p.since <= s.start + 2000) { s.live = true; s.since = p.since; } }
    return list.sort((a, b) => b.start - a.start);
  }

  // --- Data --------------------------------------------------------------
  async function poll(full) {
    clearTimeout(poll.t);
    try {
      const wantWeek = st.range === "7d" && (full || !st.wk || Date.now() - st.wk.at > 60000);
      const res = await fetch(`${WORKER}/presence?${auth()}${full ? "&seen=1" : ""}${wantWeek ? "&days=7" : ""}&t=${Date.now()}`, { cache: "no-store" });
      if (res.status === 403) { const was = device; forget(); gate(was ? "This computer's sign-in has expired. Enter the key again." : "That key didn't work."); return; }
      if (!res.ok) throw new Error(res.status);
      const r = await res.json();
      if (r.names) { st.names = r.names; st.seen = r.seen || {}; st.games = r.games || {}; }
      if (r.asks) st.asks = r.asks;
      // The week comes with seven days of taps; the live view keeps one.
      if (r.week) { st.wk = { sessions: r.week, feed: r.feed, at: Date.now() }; r.feed = r.feed.filter((e) => Date.now() - e.at < 86400000); }
      const ids = new Set(r.feed.map(evId));
      if (st.known && !st.cached) {
        for (const id of ids) if (!st.known.has(id)) st.fresh.add(id);
        for (const [n, p] of Object.entries(r.people)) if (p.in && !st.room?.people?.[n]?.in) notify(n);
      }
      st.known = ids; st.room = r; st.at = Date.now(); st.ok = true; st.cached = false;
      store.set(SNAP_STORE, JSON.stringify({ room: r, names: st.names, seen: st.seen, games: st.games, asks: st.asks }));
      setTimeout(() => { st.fresh.clear(); }, 2600);
    } catch { st.ok = false; }
    if (st.gated) return;
    render();
    poll.n = (poll.n || 0) + 1;
    poll.t = setTimeout(() => poll(poll.n % 20 === 0), document.hidden ? 30000 : 3000);
  }
  const lastSeen = (n) => Math.max(st.seen[n] || 0, st.room?.people?.[n]?.last || 0);

  function notify(n) {
    if (!st.alert || !document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(`${name(n)} is in`, { body: "Brochiefs", tag: `in-${n}`, icon: "../icons/icon-192.png" }); } catch {}
  }
  async function keepAwake() {
    if (document.hidden || st.wake || !navigator.wakeLock) return;
    try { st.wake = await navigator.wakeLock.request("screen"); st.wake.addEventListener("release", () => { st.wake = null; }); } catch {}
  }

  // --- Render ------------------------------------------------------------
  const DAY = 86400000, HOUR = 3600000;
  const hourLab = (t) => { const h = new Date(t).getHours(); return `${h % 12 || 12}${h < 12 ? "a" : "p"}`; };
  function render() {
    if (st.gated) return;
    if (st.view === "studio") { st.sig = ""; return; }
    const room = st.room;
    if (!room) { app.innerHTML = `<div class="gate"><p>Connecting…</p></div>`; return; }
    // Only rebuild when something changed; the clocks tick on their own.
    const sig = JSON.stringify([room.feed.length, room.feed[0], room.people, st.seen, st.filter, st.focus, [...st.open], st.shown, st.fresh.size, st.ok, st.cached, st.alert, st.copied, st.menu, st.refreshing, st.range, st.metric, st.wk?.at, st.asks.length, st.asks[0]?.ts, Object.keys(st.games).length, Math.floor(Date.now() / 60000)]);
    if (sig === st.sig) return;
    st.sig = sig;
    const now = Date.now(), from = now - DAY, today0 = dayOf(now);
    const people = room.people, feed = room.feed;
    const names = [...new Set([...st.names, ...Object.keys(people)])];
    const inNow = names.filter((n) => people[n]?.in).sort((a, b) => people[a].since - people[b].since);
    document.title = inNow.length ? `(${inNow.length} in) Brochiefs Live` : "Brochiefs Live";
    const order = names.slice().sort((a, b) => (people[b]?.in ? 1 : 0) - (people[a]?.in ? 1 : 0) || lastSeen(b) - lastSeen(a));
    const laneLabel = (n) => { const on = people[n]?.in, t = lastSeen(n), sel = st.filter === n; return `<button type="button" class="ln-l${on ? " in" : ""}${sel ? " sel" : ""}${t ? "" : " idle"}" data-n="${esc(n)}">${av(n, "sm", on)}<span class="t"><span class="nm">${esc(name(n))}</span><span class="st num"${on ? ` data-since="${people[n].since}"` : ""}>${on ? clock(now - people[n].since) : t ? ago(t) : "not seen"}</span></span></button>`; };
    const vs = visits(feed, people);
    const vEnd = (v) => (v.live ? now : Math.max(v.end, v.start + 1000));
    const actions = feed.filter((e) => e.k !== "in" && e.k !== "out" && !/^path-of-/.test(e.k) && e.at >= from);

    // The week: every visit of the last 7 days from the session log, plus
    // whoever is in now (their visit isn't logged until it ends).
    const wk = st.range === "7d" ? st.wk : null;
    const wFrom = today0 - 6 * DAY;
    const wv = wk ? [
      ...Object.entries(wk.sessions).flatMap(([n, list]) => list.map(([at, ms, f]) => ({ n, start: at, end: at + Math.max(ms, 1000), f: f || [] }))),
      ...inNow.map((n) => ({ n, start: people[n].since, end: now, f: [], live: true })),
    ].filter((v) => v.end >= wFrom).sort((a, b) => b.start - a.start) : [];
    const wTime = (v, a = wFrom, b = now) => Math.max(0, Math.min(v.end, b) - Math.max(v.start, a));
    const featLab = (k) => { k = String(k).replace(/-g\d+$/, ""); return SCREENS[k] || /^(path-of-|splash$)/.test(k) ? null : says({ k, n: "", d: "" }, [])[0]; };
    const dayList = Array.from({ length: 7 }, (_, i) => dayOf(wFrom + i * DAY + 3 * HOUR));
    const dShort = (d) => (d === today0 ? "Today" : new Date(d).toLocaleDateString([], { weekday: "short" }));
    const dLong = (d) => (d === today0 ? "Today" : d === today0 - DAY ? "Yesterday" : new Date(d).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }));
    const mins = (ms) => (ms >= HOUR ? `${(ms / HOUR).toFixed(1)}h` : ms >= 60000 ? `${Math.round(ms / 60000)}m` : ms > 0 ? "<1m" : "");

    // Headline numbers.
    const inToday = names.filter((n) => lastSeen(n) >= today0 || vs.some((v) => v.n === n && vEnd(v) >= today0));
    const time = vs.reduce((t, v) => t + (vEnd(v) - Math.max(v.start, from)), 0);
    const hours = Array.from({ length: 24 }, (_, i) => { const t0 = new Date(now); t0.setMinutes(0, 0, 0); const start = t0.getTime() - (23 - i) * HOUR; return { start, n: 0, who: new Set() }; });
    for (const e of actions) { const h = hours.find((x) => e.at >= x.start && e.at < x.start + HOUR); if (h) { h.n++; h.who.add(e.n); } }
    const peak = hours.reduce((m, h) => (h.n > m.n ? h : m), { n: 0 });
    const last = order.find((n) => !people[n]?.in && lastSeen(n));
    // The headline: who is in now as a slim banner, then six numbers in one
    // compact panel (a tap or hover gives the detail).
    const amt = (ms) => (ms >= HOUR ? `${(ms / HOUR).toFixed(1)}<small>h</small>` : ms >= 60000 ? `${Math.round(ms / 60000)}<small>m</small>` : `${Math.round(ms / 1000)}<small>s</small>`);
    const ks = (label, value, sub, tip) => `<div class="ks"${tip ? ` data-tip="${esc(tip)}"` : ""}><em>${label}</em><b class="num">${value}</b>${sub ? `<span>${sub}</span>` : ""}</div>`;
    const todayTip = `<b>In today</b>${inToday.length ? inToday.map(name).join(", ") : "Nobody yet"}${names.length > inToday.length ? `<br>Not yet: ${names.filter((n) => !inToday.includes(n)).map(name).join(", ")}` : ""}`;
    const stats = wk ? (() => {
      const t = wv.reduce((a, v) => a + wTime(v), 0);
      const byDay = dayList.map((d) => ({ d, ms: wv.reduce((a, v) => a + wTime(v, d, d + DAY), 0), who: new Set(wv.filter((v) => wTime(v, d, d + DAY)).map((v) => v.n)) }));
      const best = byDay.reduce((m, x) => (x.ms > m.ms ? x : m), { ms: 0 });
      return [
        ks("In today", `${inToday.length}<small>/${names.length}</small>`, "players", todayTip),
        ks("Visits · 7d", wv.length, `${new Set(wv.map((v) => v.n)).size} people`),
        ks("Time in app", t ? amt(t) : "–", "7 days"),
        ks("Avg visit", wv.length ? amt(t / wv.length) : "–", "per visit"),
        ks("Busiest", best.ms ? esc(new Date(best.d).toLocaleDateString([], { weekday: "short" })) : "–", best.ms ? `${mins(best.ms)} · ${best.who.size} ppl` : "", best.ms ? `<b>${dLong(best.d)}</b>${mins(best.ms)} in the app · ${[...best.who].map(name).join(", ")}` : ""),
        ks("A day", (wv.length / 7).toFixed(1), "visits"),
      ].join("");
    })() : [
      ks("In today", `${inToday.length}<small>/${names.length}</small>`, "players", todayTip),
      ks("Visits · 24h", vs.length, `${new Set(vs.map((v) => v.n)).size} people`),
      ks("Time in app", time ? amt(time) : "–", "24 hours"),
      ks("Avg visit", vs.length ? amt(time / vs.length) : "–", "per visit"),
      ks("Peak hour", peak.n ? hourLab(peak.start) : "–", peak.n ? `${peak.who.size} ${peak.who.size === 1 ? "person" : "ppl"}` : "", peak.n ? `<b>${hourLab(peak.start)} hour</b>${peak.n} actions · ${[...peak.who].map(name).join(", ")}` : ""),
      ks("Actions", actions.length, "24 hours"),
    ].join("");
    const kpis = `<section class="kpis" id="sec-now">
      <div class="kpi now${inNow.length ? " on" : ""}"><div class="now-l"><b class="num">${inNow.length}</b><em>in now</em></div>
        ${inNow.length ? `<div class="avs">${inNow.map((n) => `<span class="inp">${av(n, "sm", true)}${esc(name(n))}<small class="num" data-since="${people[n].since}">${clock(now - people[n].since)}</small></span>`).join("")}</div>` : `<span class="now-last">${last ? `Last in: <b>${esc(name(last))}</b> · ${esc(ago(lastSeen(last)))}` : "Nobody yet"}</span>`}</div>
      <div class="kstats">${stats}</div>
    </section>`;
    // The timeline: one lane per player, a block per visit.
    // The timeline's window: 3, 6, 12 or 24 hours back to now (6 to start),
    // so a busy afternoon gets the width instead of a sliver by the now line.
    const spanH = { "3h": 3, "6h": 6, "12h": 12 }[st.range] || 24, tSpan = spanH * HOUR, tFrom = now - tSpan;
    const xp = (t) => (((Math.min(Math.max(t, tFrom), now) - tFrom) / tSpan) * 100).toFixed(3);
    const step = spanH <= 3 ? HOUR / 2 : HOUR, every = spanH <= 6 ? 1 : spanH <= 12 ? 2 : 3;
    const marks = [];
    const h0 = new Date(tFrom); h0.setMinutes(spanH <= 3 && h0.getMinutes() >= 30 ? 30 : 0, 0, 0);
    for (let t = h0.getTime() + step; t < now; t += step) marks.push(t);
    const nights = [];
    for (let d = dayOf(tFrom); d < now; d += DAY) { const a = Math.max(d, tFrom), b = Math.min(d + 7 * HOUR, now); if (b > a) nights.push([a, b]); }
    const tickLab = (t) => { const d = new Date(t), h = d.getHours(), m = d.getMinutes(); return m ? `${h % 12 || 12}:${String(m).padStart(2, "0")}` : hourLab(t); };
    const lanes = order.map((n) => {
      const mine = vs.filter((v) => v.n === n && vEnd(v) >= tFrom);
      // Visits a couple of minutes apart are one sitting: one bar. Its
      // height says how long they were really in: a dot for a quick look,
      // a short bar under five minutes, full height past that.
      const groups = [];
      for (const v of mine.slice().sort((a, b) => a.start - b.start)) {
        const g = groups[groups.length - 1];
        if (g && v.start - g.end < 2 * 60000) { g.list.push(v); g.end = Math.max(g.end, vEnd(v)); g.live = g.live || v.live; }
        else groups.push({ list: [v], start: v.start, end: vEnd(v), live: !!v.live });
      }
      const blocks = groups.map((g) => {
        const first = g.list[0], id = `${first.n}|${first.start}`;
        const inApp = g.list.reduce((t, v) => t + (vEnd(v) - v.start), 0);
        const acts = g.list.reduce((t, v) => t + v.acts.length, 0);
        const size = g.live || inApp >= 5 * 60000 ? "" : inApp < 60000 ? " peek" : " short";
        const tip = `<b>${esc(name(n))}${g.live ? " · in now" : ""}</b>${g.list.length > 1 ? `${g.list.length} visits · ` : ""}${esc(hm(g.start))}${g.live ? "" : ` to ${esc(hm(g.end))}`} · ${esc(dur(inApp))} in the app<br>${acts} action${acts === 1 ? "" : "s"}${first.app ? ` · ${first.app === "home" ? "home screen app" : "browser"}` : ""}`;
        return `<i class="blk${size}${g.live ? " live" : ""}${g.list.some((v) => st.focus === `${v.n}|${v.start}`) ? " focus" : ""}" style="${g.live ? `right:0;width:max(10px, ${(100 - xp(g.start)).toFixed(3)}%)` : `left:min(${xp(g.start)}%, calc(100% - ${size ? 14 : 8}px));width:${(xp(g.end) - xp(g.start)).toFixed(3)}%`}" data-v="${esc(id)}" data-tip="${esc(tip)}"></i>`;
      }).join("");
      // Nobody in the window: the lane steps back.
      return `${laneLabel(n).replace('class="ln-l', `class="ln-l${mine.length ? "" : " quiet"}`)}<div class="ln-t${st.filter === n ? " sel" : ""}${mine.length ? "" : " quiet"}">${blocks}</div>`;
    }).join("");
    // Labels on the hour at the window's step, and the half hours at 3h.
    const labelled = (t) => { const d = new Date(t); return d.getMinutes() ? spanH <= 3 : d.getHours() % every === 0; };
    const axis = marks.filter((t) => labelled(t) && xp(t) < 87 && xp(t) > 4).map((t) => `<span style="left:${xp(t)}%">${tickLab(t)}</span>`).join("") + `<span class="nowl" style="left:100%">NOW</span>`;
    const seg = `<span class="seg end" role="group" aria-label="Range">${["3h", "6h", "12h", "24h", "7d"].map((r) => `<button type="button" class="${st.range === r ? "on" : ""}" data-range="${r}">${r}</button>`).join("")}</span>`;
    const weekView = () => {
      if (!wk) return `<div class="note">Loading the week…</div>`;
      // Who, which day: visits (or minutes, by the switch), darker for more;
      // a tap or hover gives both.
      const byMin = st.metric === "min";
      const cell = (n, d) => { const mine = wv.filter((v) => v.n === n && wTime(v, d, d + DAY) > 0); return { n: mine.length, ms: mine.reduce((a, v) => a + wTime(v, d, d + DAY), 0), f: [...new Set(mine.flatMap((v) => v.f.map(featLab)).filter(Boolean))] }; };
      const grid = order.map((n) => dayList.map((d) => cell(n, d)));
      const val = (x) => (byMin ? x.ms : x.n);
      const maxV = Math.max(1, ...grid.flat().map(val));
      const hmHtml = `<div class="hm">
        <span></span>${dayList.map((d) => `<span class="hm-h${d === today0 ? " t" : ""}">${esc(dShort(d))}<small>${new Date(d).getDate()}</small></span>`).join("")}
        ${order.map((n, r) => laneLabel(n) + dayList.map((d, c) => { const x = grid[r][c], v = val(x), a = v ? 0.16 + 0.74 * Math.sqrt(v / maxV) : 0; return `<i class="hm-c${x.n ? "" : " z"}${st.filter && st.filter !== n ? " dim" : ""}" style="${v ? `background:rgba(139, 108, 255, ${a.toFixed(2)})` : ""}" data-tip="${esc(`<b>${name(n)} · ${dLong(d)}</b>${x.n ? `${x.n} visit${x.n === 1 ? "" : "s"} · ${mins(x.ms)} in the app${x.f.length ? `<br>${x.f.slice(0, 5).join(", ")}` : ""}` : "Not in"}`)}">${x.n ? (byMin ? mins(x.ms) : x.n) : ""}</i>`; }).join("")).join("")}
      </div>`;
      // When in the day: a punch card, a row per day and a column per hour,
      // a bigger, brighter dot for more visits starting in that hour.
      const pc = dayList.map((d) => Array.from({ length: 24 }, (_, h) => ({ d, h, n: 0, who: new Set() })));
      for (const v of wv) {
        if (st.filter && v.n !== st.filter) continue;
        const r = dayList.findIndex((d) => v.start >= d && v.start < d + DAY);
        if (r < 0) continue;
        const c = pc[r][new Date(v.start).getHours()]; c.n++; c.who.add(v.n);
      }
      const maxP = Math.max(1, ...pc.flat().map((c) => c.n)), nowH = new Date(now).getHours();
      const hourLabel = (h) => `${h % 12 || 12}${h < 12 ? "a" : "p"}`;
      const pcHtml = `<div class="pc">
        ${pc.map((row, r) => { const d = dayList[r], tot = row.reduce((a, c) => a + c.n, 0); return `<span class="pc-l${d === today0 ? " t" : ""}"><b>${esc(dShort(d))}</b><small>${tot}</small></span>${row.map((c) => { const k = c.n ? Math.sqrt(c.n / maxP) : 0; return `<i class="pc-c${d === today0 && c.h === nowH ? " now" : ""}${d === today0 && c.h > nowH ? " fut" : ""}"${c.n ? ` data-tip="${esc(`<b>${dLong(d)} · ${hourLabel(c.h)}</b>${c.n} visit${c.n === 1 ? "" : "s"} · ${[...c.who].map(name).join(", ")}`)}"` : ""}><s style="${c.n ? `width:${(30 + 70 * k).toFixed(0)}%;height:${(30 + 70 * k).toFixed(0)}%;opacity:${(0.45 + 0.55 * k).toFixed(2)}` : ""}"></s></i>`; }).join("")}`; }).join("")}
        <span></span>${Array.from({ length: 24 }, (_, h) => `<span class="pc-x">${h % 3 === 0 ? hourLabel(h) : ""}</span>`).join("")}
      </div>`;
      const firstTap = (wk.feed || []).reduce((m, e) => Math.min(m, e.at), now);
      return `<div class="sub2 row">Who was in, day by day ${st.filter ? "" : "· tap a name to follow one person"}<span class="seg sm" role="group" aria-label="Show"><button type="button" class="${byMin ? "" : "on"}" data-metric="visits">Visits</button><button type="button" class="${byMin ? "on" : ""}" data-metric="min">Minutes</button></span></div>${hmHtml}
        <div class="sub2" style="margin-top:20px">When in the day${st.filter ? ` · ${esc(name(st.filter))}` : " · everyone"} · visits by hour</div>
        ${pcHtml}
        ${firstTap > wFrom + HOUR ? `<div class="note" style="margin-top:10px">Visits above go back all 7 days. Tap by tap detail in the visit list starts ${esc(dLong(dayOf(firstTap)))}.</div>` : ""}`;
    };
    const timeline = wk || st.range === "7d" ? `<section class="tl panel" id="sec-tl">
      <div class="ph"><h2>Last 7 days</h2>${seg}</div>
      ${weekView()}
    </section>` : `<section class="tl panel" id="sec-tl">
      <div class="ph"><h2>Last ${spanH} hours</h2>${seg}</div>
      <div class="tl-hint"><span>Dot: quick look · short: under 5 min · tall: longer</span><span class="key"><i></i>visit <i class="lv"></i>live</span></div>
      <div class="tl-grid">
        <span></span><div class="tl-ax">${axis}</div>
        <div class="tl-over">${nights.map(([a, b]) => `<i class="night" style="left:${xp(a)}%;width:${(xp(b) - xp(a)).toFixed(3)}%"></i>`).join("")}${marks.map((t) => `<i class="hr${new Date(t).getHours() === 0 ? " mid" : ""}" style="left:${xp(t)}%"></i>`).join("")}<i class="now"></i></div>
        ${lanes}
      </div>
    </section>`;

    // Side charts: actions by hour, what got used most, how they open it.
    // The week: visits by hour of the day, and what most visits used.
    const askPanel = (fromTs, label) => {
      const list = st.asks.filter((x) => x.ts >= fromTs && (!st.filter || x.n === st.filter)).slice(0, 5);
      if (!list.length) return "";
      return `<section class="panel"><div class="ph"><h2>Asked the archive</h2><span class="sub">${label}</span></div>
        <div class="asks">${list.map((x) => `<button type="button" class="ask" data-ask="${x.ts}"><span class="ask-h">${x.n ? av(x.n, "sm") : ""}<b>${esc(x.n ? name(x.n) : "Someone")}</b><time>${esc(dayOf(x.ts) === today0 ? hm(x.ts) : `${new Date(x.ts).toLocaleDateString([], { weekday: "short" })} ${hm(x.ts)}`)}</time></span><span class="ask-q">${esc(x.q)}</span></button>`).join("")}</div>
      </section>`;
    };
    const railWeek = () => {
      const byH = Array.from({ length: 24 }, (_, h) => ({ h, n: 0, who: new Set() }));
      for (const v of wv) { const h = new Date(v.start).getHours(); byH[h].n++; byH[h].who.add(v.n); }
      const mx = Math.max(1, ...byH.map((x) => x.n)), curH = new Date(now).getHours();
      const used = new Map();
      for (const v of wv) for (const l of new Set(v.f.map(featLab).filter(Boolean))) used.set(l, (used.get(l) || 0) + 1);
      const tp = [...used.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6), mf = tp[0]?.[1] || 1;
      const lab = (h) => `${h % 12 || 12}${h < 12 ? "a" : "p"}`;
      return `<aside class="rail" id="sec-stats">
      <section class="panel"><div class="ph"><h2>Visits by hour</h2><span class="sub">time of day, last 7 days</span></div>
        <div class="bars">${byH.map((x) => `<i class="${x.n ? "" : "zero"}${x.h === curH ? " cur" : ""}" data-tip="${esc(`<b>${lab(x.h)}</b>${x.n} visit${x.n === 1 ? "" : "s"}${x.who.size ? ` · ${[...x.who].map(name).join(", ")}` : ""}`)}"><b style="height:${((x.n / mx) * 100).toFixed(1)}%"></b></i>`).join("")}</div>
        <div class="bars-ax"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>11p</span></div>
      </section>
      <section class="panel"><div class="ph"><h2>Most used</h2><span class="sub">visits that used it, 7 days</span></div>
        ${tp.length ? `<div class="rank">${tp.map(([a, n]) => `<div><span>${esc(a)}</span><b>${n}</b><i><s style="width:${((n / mf) * 100).toFixed(1)}%"></s></i></div>`).join("")}</div>` : `<div class="note">Nothing used yet.</div>`}
      </section>
      ${askPanel(wFrom, "last 7 days")}
    </aside>`;
    };
    const maxH = Math.max(1, ...hours.map((h) => h.n));
    const counts = new Map();
    for (const e of actions) { if (SCREENS[e.k]) continue; const [a] = says(e, feed); counts.set(a, (counts.get(a) || 0) + 1); }
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6), maxF = top[0]?.[1] || 1;
    const home = vs.filter((v) => v.app === "home").length, web = vs.filter((v) => v.app === "browser").length;
    const rail = wk ? railWeek() : `<aside class="rail" id="sec-stats">
      <section class="panel"><div class="ph"><h2>Activity by hour</h2><span class="sub">actions, last 24h</span></div>
        <div class="bars">${hours.map((h, i) => `<i class="${h.n ? "" : "zero"}${i === 23 ? " cur" : ""}" data-tip="${esc(`<b>${hourLab(h.start)}${i === 23 ? " · this hour" : ""}</b>${h.n} action${h.n === 1 ? "" : "s"}${h.who.size ? ` · ${[...h.who].map(name).join(", ")}` : ""}`)}"><b style="height:${((h.n / maxH) * 100).toFixed(1)}%"></b></i>`).join("")}</div>
        <div class="bars-ax"><span>${hourLab(hours[0].start)}</span><span>${hourLab(hours[6].start)}</span><span>${hourLab(hours[12].start)}</span><span>${hourLab(hours[18].start)}</span><span>now</span></div>
      </section>
      <section class="panel"><div class="ph"><h2>Most used</h2><span class="sub">last 24h</span></div>
        ${top.length ? `<div class="rank">${top.map(([a, n]) => `<div><span>${esc(a)}</span><b>${n}</b><i><s style="width:${((n / maxF) * 100).toFixed(1)}%"></s></i></div>`).join("")}</div>` : `<div class="note">Nothing used yet.</div>`}
      </section>
      ${home + web ? `<section class="panel"><div class="ph"><h2>Opened from</h2><span class="sub">${home + web} visits</span></div>
        <div class="split"><s style="width:${((home / (home + web)) * 100).toFixed(1)}%;background:var(--past)"></s><s style="flex:1;background:#5b5378"></s></div>
        <div class="split-k"><span><i style="background:var(--past)"></i>Home screen app <b>${home}</b></span><span><i style="background:#5b5378"></i>Browser <b>${web}</b></span></div>
      </section>` : ""}
      ${askPanel(from, "last 24h")}
    </aside>`;

    // The feed: one card per visit, newest first.
    const all = (wk ? visits(wk.feed || [], people) : vs).filter((s) => !st.filter || s.n === st.filter);
    // Each visit as plain text, for Copy: who, when, how long, and every
    // line in order.
    st.texts = new Map();
    for (const s of all.slice(0, st.shown)) {
      const when = s.live ? `in now, since ${hm(s.start)} (${dur(now - s.since)})` : `${hm(s.start)} to ${hm(s.end)} (${dur(Math.max(s.end - s.start, 1000))})`;
      const scr = s.live && SCREENS[people[s.n]?.screen] ? ` · on ${SCREENS[people[s.n].screen]}` : "";
      st.texts.set(`${s.n}|${s.start}`, [`${name(s.n)} · ${dayLab(s.start)} · ${when}${s.app ? ` · ${s.app === "home" ? "home screen app" : "browser"}` : ""}${scr}`,
        ...s.acts.map((a) => `  ${hm(a.at)}  ${a.a}${a.d ? `${/^for /.test(a.d) ? " " : ": "}${a.d}` : ""}${a.x > 1 ? ` (×${a.x})` : ""}`)].join("\n"));
    }
    let day = null;
    const cards = all.slice(0, st.shown).map((s) => {
      const d = dayLab(s.start), head = d !== day ? `<div class="day">${esc(d)}</div>` : "";
      day = d;
      const id = `${s.n}|${s.start}`, LIM = 6, open = st.open.has(id);
      const acts = open ? s.acts : s.acts.slice(-LIM);
      const span = s.live ? "" : ` · ${dur(Math.max(s.end - s.start, 1000))}`;
      const meta = `${hm(s.start)}${s.live ? "" : s.done || s.end > s.start ? ` to ${hm(s.end)}` : ""}${span}${s.app ? ` · ${s.app === "home" ? "home screen app" : "browser"}` : ""}${s.live && people[s.n]?.screen && SCREENS[people[s.n].screen] ? ` · on ${SCREENS[people[s.n].screen]}` : ""}`;
      const fresh = s.acts.some((a) => a.ids.some((x) => st.fresh.has(x))) || st.fresh.has(`${s.n}|${s.start}|in`);
      return `${head}<div class="sess${s.live ? " live" : ""}${st.fresh.has(`${s.n}|${s.start}|in`) ? " fresh" : ""}${st.focus === id ? " focus" : ""}" data-v="${esc(id)}">
        <div class="sh">${av(s.n, "lg", s.live)}<div class="who"><div class="nm">${esc(name(s.n))}</div><div class="meta num">${esc(meta)}</div></div><div class="sh-r"><span class="badge num"${s.live ? ` data-since="${s.since}"` : ""}>${s.live ? clock(now - s.since) : s.done ? "LEFT" : "ENDED"}</span><button type="button" class="cp${st.copied === id ? " ok" : ""}" data-copy="${esc(id)}" aria-label="Copy ${esc(name(s.n))}'s visit" title="Copy this visit">${st.copied === id ? "✓ Copied" : COPY_ICON}</button></div></div>
        ${s.acts.length ? `<ul class="acts">${s.acts.length > LIM && !open ? `<li class="quiet"><span></span><span>${s.acts.length - LIM} earlier</span></li>` : ""}${acts.map((a) => { const pid = `${s.n}|${a.at}`; return `<li class="${a.ids.some((x) => st.fresh.has(x)) && fresh ? "new" : ""}${a.go ? " go" : ""}${st.pv?.id === pid ? " on" : ""}"${a.go ? ` data-go="${esc(a.go)}" data-pid="${esc(pid)}" data-who="${esc(s.n)}" data-at="${a.at}" data-what="${esc(a.a + (a.d ? ` ${a.d}` : ""))}" tabindex="0" role="button"` : ""}><time class="num">${esc(hm(a.at))}</time><span>${esc(a.a)}${a.d ? ` <em>${esc(a.d)}</em>` : ""}${a.x > 1 ? ` <span class="x">×${a.x}</span>` : ""}${a.go ? `<i class="peek" aria-hidden="true">▸</i>` : ""}</span></li>`; }).join("")}</ul>` : ""}
        ${s.acts.length > LIM ? `<button type="button" class="more" data-open="${esc(id)}">${open ? "Show less" : `Show all ${s.acts.length}`}</button>` : ""}
      </div>`;
    }).join("");
    const shownN = Math.min(all.length, st.shown);
    const feedHtml = `<main class="feed" id="sec-visits">
      <div class="fh"><h2>VISITS</h2>${st.filter ? `<span class="chip">${av(st.filter, "sm")}${esc(name(st.filter))}<button type="button" data-n="" aria-label="Show everyone">✕</button></span>` : ""}
        ${all.length ? `<button type="button" class="cp${st.copied === "*" ? " ok" : ""}" data-copy="*" title="Copy every visit shown">${st.copied === "*" ? "✓ Copied" : `${COPY_ICON}Copy ${st.filter ? `${esc(name(st.filter))}'s` : "all"}`}</button>` : ""}</div>
      ${cards || `<div class="empty" style="margin-top:12px">${st.filter ? `No visits from ${esc(name(st.filter))} in the last 24 hours.` : "No visits in the last 24 hours yet. They show here as people use the app."}</div>`}
      ${all.length > st.shown ? `<button type="button" class="older" data-older="1">Show ${Math.min(20, all.length - st.shown)} more</button>` : ""}
      <p class="note">A visit is live while the app is on screen and ends when it's put away, or about a minute after a phone goes quiet. Shows screens and features, never which team anyone picked. Jake isn't tracked.</p>
    </main>`;

    app.innerHTML = `
      <div class="top${st.ok ? "" : " stale"}"><div class="top-in">
        <button type="button" class="brand" data-reload="1" aria-label="Refresh"><i class="beat"></i><b>BROCHIEFS</b><span>LIVE</span></button>
        <span class="age num" id="age">${st.cached ? "refreshing…" : st.ok ? "live" : "can't reach the server, retrying"}</span>
        <div class="tools">
          <button type="button" class="ib${st.refreshing ? " spin" : ""}" data-refresh="1" aria-label="Refresh" title="Refresh">${ICONS.refresh}</button>
          <button type="button" class="ib${st.menu ? " on" : ""}" data-menu="1" aria-label="Menu" aria-expanded="${st.menu}" title="Menu">${ICONS.more}</button>
          ${st.menu ? `<div class="menu" role="menu">
            ${"Notification" in window ? `<button type="button" role="menuitem" data-alert="1">${ICONS.bell}<span>${st.alert ? "Turn alerts off" : "Alert me when someone comes in"}</span>${st.alert ? `<i class="on">ON</i>` : ""}</button>` : ""}
            <button type="button" role="menuitem" data-copy="*">${ICONS.copy}<span>Copy ${st.filter ? `${esc(name(st.filter))}'s` : "all"} visits</span></button>
            <a role="menuitem" href="../" target="_blank" rel="noopener">${ICONS.app}<span>Open Pick'em</span><i>↗</i></a>
            <a role="menuitem" href="../?admin" target="_blank" rel="noopener">${ICONS.console}<span>Admin console</span><i>↗</i></a>
            <hr>
            <button type="button" role="menuitem" class="danger" data-signout="1">${ICONS.out}<span>${device ? "Forget this device" : "Sign out"}</span></button>
          </div>` : ""}
        </div>
      </div></div>
      <div class="page">${kpis}${timeline}${feedHtml}${rail}</div>
      <nav class="tabs" aria-label="Sections">${TABS.map(([id, lab, ic]) => `<button type="button" class="${st.sec === id ? "on" : ""}" data-sec="${id}">${ICONS[ic]}<span>${lab}${id === "sec-now" && inNow.length ? `<b>${inNow.length}</b>` : ""}</span></button>`).join("")}<button type="button" data-studio="1">${ICONS.studio}<span>Studio${sd.review ? `<b>${sd.review}</b>` : ""}</span></button></nav>`;
    paintTabs();
  }

  // Hover tips for the timeline and the charts; a tap shows one too.
  const tipEl = document.getElementById("tip");
