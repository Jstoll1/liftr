<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0716">
<title>Brochiefs Live</title>
<!-- A home screen app on iPhone and iPad; the desktop layout from 880px. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://liftr-ai.jhs797.workers.dev" crossorigin>
<style>
/* The admin's live page: who is in the app now, who was in last, and
   what each did, one card per visit. System fonts and no libraries, so
   it paints at once; the last view is drawn from this device straight
   away and replaced when the Worker answers. */
:root {
  --bg: #0b0716; --panel: #140e24; --panel2: #1b1430; --line: #2a2140;
  --text: #f3efff; --meta: #b8afd3; --dim: #8a80a8;
  --green: #3dfc8f; --green-bg: rgba(61, 252, 143, .09); --cyan: #4fe3f0; --gold: #ffe45e;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 5; background: rgba(11, 7, 22, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; }
.brand { padding: 0; background: none; border: 0; -webkit-tap-highlight-color: transparent; }
.brand { display: flex; align-items: center; gap: 9px; font: 700 14px/1 var(--mono); letter-spacing: .14em; }
.brand b { color: var(--gold); }
.brand span { color: var(--green); }
.beat { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: beat 1.6s ease-in-out infinite; }
.top.stale .beat { background: #ffb347; box-shadow: 0 0 10px #ffb347; }
@keyframes beat { 50% { opacity: .3; } }
.age { font-size: 12.5px; color: var(--dim); }
.tools { margin-left: auto; display: flex; gap: 6px; }
.tool { padding: 6px 11px; font-size: 13px; color: var(--meta); background: none; border: 1px solid var(--line); border-radius: 8px; }
.tool:hover { color: var(--text); }
.tool.on { color: var(--green); border-color: rgba(61, 252, 143, .5); }
.tool { white-space: nowrap; }
@media (max-width: 560px) { .age { display: none; } .tool { padding: 6px 9px; font-size: 12.5px; } }

/* Page */
.page { max-width: 1200px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 880px) { .page { grid-template-columns: 270px minmax(0, 1fr); align-items: start; } .side { position: sticky; top: 74px; } }
.label { margin: 0 0 8px; font: 600 11px/1 var(--mono); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }

/* People */
.people { display: flex; flex-direction: column; gap: 3px; }
.person { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; }
.person:hover { background: var(--panel); }
.person.sel { background: var(--panel2); border-color: var(--line); }
.person .nm { font-weight: 600; }
.person .st { margin-left: auto; font-size: 13px; color: var(--dim); }
.person.in .st { color: var(--green); font-weight: 600; }
.person.all .nm { color: var(--meta); font-weight: 500; }
@media (max-width: 879px) {
  .people { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: none; }
  .person { flex: none; width: auto; padding: 6px 12px 6px 6px; background: var(--panel); border-color: var(--line); border-radius: 999px; }
  .person.sel { border-color: var(--cyan); }
  .person .st { margin-left: 2px; font-size: 12px; }
  .person.all { padding-left: 12px; }
}
.av { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--c); color: #0b0716; font: 800 13px/1 system-ui, sans-serif; position: relative; }
.av.lg { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; }
.in .av::after, .sess.live .av::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--green); border: 2px solid var(--bg); }

/* Summary */
.sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.sum.live { background: var(--green-bg); border-color: rgba(61, 252, 143, .4); }
.sum b { font-size: 22px; }
.sum.live b { color: var(--green); }
.sum span { color: var(--meta); }
.sum small { flex-basis: 100%; font-size: 13px; color: var(--dim); }

/* Visits */
.day { margin: 22px 0 8px; }
.sess { margin-bottom: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.sess.live { border-color: rgba(61, 252, 143, .45); background: linear-gradient(var(--green-bg), var(--green-bg)), var(--panel); }
.sess.fresh { animation: arrive 2s ease-out; }
@keyframes arrive { from { box-shadow: 0 0 0 2px var(--green), 0 0 28px rgba(61, 252, 143, .45); } }
.sh { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.sh .who { min-width: 0; }
.sh .nm { font-size: 16px; font-weight: 700; }
.sh .meta { font-size: 13px; color: var(--meta); }
.sh-r { margin-left: auto; flex: none; display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; }
@media (max-width: 560px) { .sh-r { flex-direction: column; align-items: flex-end; gap: 6px; } .sh-r .cp { min-height: 30px; padding: 5px 11px; } }
.cp { flex: none; min-height: 32px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--cyan); background: rgba(79, 227, 240, .08); border: 1px solid rgba(79, 227, 240, .3); border-radius: 999px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.cp:active { transform: scale(.96); }
.cp.ok { color: #0b0716; background: var(--green); border-color: var(--green); }
.cpall { display: flex; justify-content: flex-end; margin: 12px 0 -10px; }
.cpall .cp { margin-left: auto; }
.badge { flex: none; padding: 4px 9px; border-radius: 999px; font: 700 12px/1 var(--mono); }
.sess.live .badge { color: #0b0716; background: var(--green); }
.sess:not(.live) .badge { color: var(--meta); background: var(--panel2); }
.acts { margin: 0; padding: 4px 14px 10px 62px; list-style: none; border-top: 1px solid var(--line); }
.acts li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 5px 0; font-size: 14px; }
.acts li + li { border-top: 1px solid rgba(255, 255, 255, .04); }
.acts time { color: var(--dim); font-size: 12.5px; padding-top: 1px; }
.acts em { font-style: normal; color: var(--cyan); }
.acts .x { color: var(--dim); font-size: 12.5px; }
.acts li.new { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 30% { background: rgba(61, 252, 143, .14); } }
.acts .quiet { color: var(--dim); font-size: 13px; }
@media (max-width: 560px) { .acts { padding-left: 14px; } }
.more { display: block; padding: 0 14px 12px 62px; font-size: 13px; color: var(--cyan); background: none; border: 0; text-align: left; }
.empty { padding: 18px; border-radius: 14px; border: 1px dashed var(--line); color: var(--dim); }
.older { margin-top: 4px; padding: 10px 14px; width: 100%; color: var(--cyan); background: none; border: 1px solid var(--line); border-radius: 12px; }
.note { margin-top: 26px; font-size: 12.5px; color: var(--dim); }

/* Lines that open a preview */
.acts li.go { cursor: pointer; border-radius: 8px; margin: 0 -8px; padding: 5px 8px; }
.acts li.go:hover, .acts li.go:focus-visible { background: rgba(79, 227, 240, .08); outline: none; }
.acts li.go.on { background: rgba(79, 227, 240, .14); box-shadow: inset 2px 0 0 var(--cyan); }
.acts li .peek { margin-left: 8px; font-style: normal; font-size: 11px; color: var(--dim); opacity: 0; transition: opacity .15s; }
.acts li.go:hover .peek, .acts li.go.on .peek { opacity: 1; color: var(--cyan); }
@media (hover: none) { .acts li .peek { opacity: .7; } }

/* The preview panel: a phone-width frame at the right on a wide screen,
   a full screen sheet on a narrow one. */
.pv { display: none; }
body.pv-open .pv { display: flex; flex-direction: column; position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: 100%; background: var(--bg); }
@media (min-width: 1100px) {
  body.pv-open .pv { top: 61px; width: 430px; border-left: 1px solid var(--line); background: #0d0919; }
  body.pv-open #app .page { margin-right: 430px; }
}
.pv-h { display: flex; align-items: flex-start; gap: 8px; padding: max(12px, env(safe-area-inset-top)) 14px 12px; border-bottom: 1px solid var(--line); }
.pv-t { flex: 1; min-width: 0; font-size: 14px; }
.pv-t span { display: block; font-size: 13px; color: var(--meta); }
.pv-h a.tool { text-decoration: none; }
.pv-note { padding: 7px 14px; font-size: 12px; color: var(--dim); background: rgba(0, 0, 0, .2); }
.pv-frame { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 12px 12px max(12px, env(safe-area-inset-bottom)); }
.pv-frame iframe { width: 100%; max-width: 400px; height: 100%; border: 1px solid var(--line); border-radius: 18px; background: #0a0414; }
.pv-none { margin: 16px; padding: 16px; border-radius: 12px; border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; color: var(--meta); font-size: 14px; }
.pv-none b { color: var(--text); }

/* Key */
.gate { max-width: 340px; margin: 18vh auto 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
.gate h1 { margin: 0; font: 700 16px/1 var(--mono); letter-spacing: .14em; color: var(--green); }
.gate p { margin: 0; color: var(--meta); }
.gate input { padding: 12px; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.gate button { padding: 12px; font-weight: 700; color: #0b0716; background: var(--green); border: 0; border-radius: 10px; }
.gate .err { color: #ff6b93; font-size: 13px; min-height: 1em; }
.gate .rem { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--meta); cursor: pointer; }
.gate .rem input { width: 16px; height: 16px; accent-color: var(--green); }
.gate button:disabled { opacity: .6; }
@media (prefers-reduced-motion: reduce) { .beat, .sess.fresh, .acts li.new { animation: none; } }
</style>
</head>
<body>
<div id="app"></div>
<aside id="pv" class="pv" aria-label="Preview"></aside>
<script>
(() => {
  const WORKER = "https://liftr-ai.jhs797.workers.dev";
  // Signed in either as a remembered device (a token the Worker signed,
  // kept on this computer for 180 days) or with the key for this browser
  // session only. The key itself is never kept.
  const KEY_STORE = "brochiefs_live_key", DEVICE_STORE = "brochiefs_live_device", SNAP_STORE = "brochiefs_live_snap";
  const COLORS = ["#ff4f9a", "#ffe45e", "#c77dff", "#ffb347", "#3dfc8f", "#ff6b6b", "#4fe3f0", "#7aa2ff", "#9cf27a", "#ff9d3d"];
  const SHOWN = { Conlan: "Connie" };
  const SCREENS = { picks: "Picks", scoreboard: "Scores", history: "History", trivia: "Trivia", home: "Home", roster: "the roster", splash: "the splash screen" };
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
  const session = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: (k) => { try { sessionStorage.removeItem(k); } catch {} } };
  let device = store.get(DEVICE_STORE) || "", key = session.get(KEY_STORE) || "";
  const auth = () => (device ? `device=${encodeURIComponent(device)}` : `key=${encodeURIComponent(key)}`);
  async function remember(k) {
    try {
      const r = await fetch(`${WORKER}/presence-device?key=${encodeURIComponent(k)}`, { method: "POST", cache: "no-store" });
      if (!r.ok) return r.status;
      device = (await r.json()).token || "";
      if (device) store.set(DEVICE_STORE, device);
      return device ? 200 : 500;
    } catch { return 0; }
  }
  function forget() { device = ""; key = ""; store.del(DEVICE_STORE); store.del(KEY_STORE); store.del(SNAP_STORE); session.del(KEY_STORE); }

  // room: the Worker's answer. names, seen, games: the once-a-minute extras.
  const st = { texts: new Map(), copied: null, pv: null, room: null, names: [], seen: {}, games: {}, at: 0, ok: true, cached: false, known: null, fresh: new Set(), filter: null, open: new Set(), shown: 20, alert: false, wake: null, gated: false, sig: "" };

  // --- Formatting --------------------------------------------------------
  const name = (n) => SHOWN[n] || n;
  const color = (n) => COLORS[[...n].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % COLORS.length];
  const av = (n, lg) => `<span class="av${lg ? " lg" : ""}" style="--c:${color(n)}">${esc(name(n)[0])}</span>`;
  const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}:${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : `${m}:${String(s % 60).padStart(2, "0")}`; };
  const dur = (ms) => ms < 60000 ? `${Math.max(1, Math.round(ms / 1000))}s` : ms < 3600000 ? `${Math.round(ms / 60000)} min` : `${(ms / 3600000).toFixed(1)} hr`;
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
  const hm = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const dayOf = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const dayLab = (t) => { const d = dayOf(t), today = dayOf(Date.now()); return d === today ? "Today" : d === today - 86400000 ? "Yesterday" : new Date(t).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }); };
  const nameFrom = (slug) => st.names.find((n) => n.toLowerCase() === slug) || slug.charAt(0).toUpperCase() + slug.slice(1);
  const evId = (e) => `${e.n}|${e.at}|${e.k}`;

  // One action in plain words, with its detail (a game, a person) apart.
  const SAYS = {
    "game-info": "Opened game info", gamecast: "Watched the live game cast", "game-final": "Opened a final recap",
    "scorebug-open": "Tapped a score", "ranking-expand": "Opened a leaderboard card",
    "path-share": "Shared a Path to Win", "path-intro": "Saw the Path to Win intro",
    "wp-player": "Opened a win % breakdown", "wp-explain": "Read how win % works", h2h: "Opened head to head",
    "pot-open": "Opened the pot", "all-picks-open": "Opened everyone's picks", "pick-saved": "Saved a pick", "pick-updated": "Changed a pick",
    sim: "Ran a game sim", "grid-card": "Opened a grid card",
  };
  function says(e, feed) {
    if (e.k === "path-run" || e.k === "path-card") {
      const of = feed.find((x) => x.n === e.n && /^path-of-/.test(x.k) && Math.abs(x.at - e.at) < 3000);
      return [e.k === "path-run" ? "Ran Path to Win" : "Opened a Path to Win card", of ? `for ${name(nameFrom(of.k.slice(8)))}` : ""];
    }
    if (SAYS[e.k]) return [SAYS[e.k], /^(game-|gamecast|scorebug)/.test(e.k) ? st.games[e.d] || "" : e.k === "ranking-expand" && e.d ? name(e.d) : ""];
    if (SCREENS[e.k]) return [`Went to ${SCREENS[e.k]}`, ""];
    return [e.k.charAt(0).toUpperCase() + e.k.slice(1).replace(/-/g, " "), ""];
  }

  // Where a line opens in the preview: a view of the app, or null.
  function target(e, feed) {
    if (/^(game-info|gamecast|game-final|scorebug-open)$/.test(e.k) && e.d) return `game&x=${encodeURIComponent(e.d)}`;
    if (e.k === "ranking-expand" && e.d) return `card&x=${encodeURIComponent(e.d)}`;
    if (e.k === "path-run" || e.k === "path-card") {
      const of = feed.find((x) => x.n === e.n && /^path-of-/.test(x.k) && Math.abs(x.at - e.at) < 3000);
      return of ? `path&x=${encodeURIComponent(nameFrom(of.k.slice(8)))}` : "scoreboard";
    }
    if (e.k === "h2h") return "h2h";
    if (e.k === "history" || e.k === "trivia" || e.k === "scoreboard") return e.k;
    if (e.k === "picks" || /^pick-/.test(e.k)) return "picks";
    if (/^(pot-open|all-picks-open|wp-player|wp-explain|sim|grid-card|path-intro|path-share)$/.test(e.k)) return "scoreboard";
    return null;
  }

  // The feed as visits: each "in" starts one, an "out" ends it; uses in
  // between are its lines, oldest first. Visits newest first.
  function visits(feed, people) {
    const open = {}, list = [];
    for (const e of feed.filter((x) => !/^path-of-/.test(x.k)).slice().reverse()) {
      let s = open[e.n];
      if (e.k === "in" || !s) {
        s = open[e.n] = { n: e.n, start: e.at, end: e.at, app: e.k === "in" ? e.d : "", acts: [], done: false };
        list.push(s);
        if (e.k === "in") continue;
      }
      if (e.k === "out") { s.end = e.at; s.done = true; delete open[e.n]; continue; }
      const last = s.acts[s.acts.length - 1];
      const [a, d] = says(e, feed);
      if (last && last.a === a && last.d === d) { last.x++; last.ids.push(evId(e)); } else s.acts.push({ at: e.at, a, d, x: 1, ids: [evId(e)], go: target(e, feed) });
      s.end = e.at;
    }
    for (const s of Object.values(open)) { const p = people[s.n]; if (p?.in && p.since <= s.start + 2000) { s.live = true; s.since = p.since; } }
    return list.sort((a, b) => b.start - a.start);
  }

  // --- Data --------------------------------------------------------------
  async function poll(full) {
    clearTimeout(poll.t);
    try {
      const res = await fetch(`${WORKER}/presence?${auth()}${full ? "&seen=1" : ""}&t=${Date.now()}`, { cache: "no-store" });
      if (res.status === 403) { const was = device; forget(); gate(was ? "This computer's sign-in has expired. Enter the key again." : "That key didn't work."); return; }
      if (!res.ok) throw new Error(res.status);
      const r = await res.json();
      if (r.names) { st.names = r.names; st.seen = r.seen || {}; st.games = r.games || {}; }
      const ids = new Set(r.feed.map(evId));
      if (st.known && !st.cached) {
        for (const id of ids) if (!st.known.has(id)) st.fresh.add(id);
        for (const [n, p] of Object.entries(r.people)) if (p.in && !st.room?.people?.[n]?.in) notify(n);
      }
      st.known = ids; st.room = r; st.at = Date.now(); st.ok = true; st.cached = false;
      store.set(SNAP_STORE, JSON.stringify({ room: r, names: st.names, seen: st.seen, games: st.games }));
      setTimeout(() => { st.fresh.clear(); }, 2600);
    } catch { st.ok = false; }
    if (st.gated) return;
    render();
    poll.n = (poll.n || 0) + 1;
    poll.t = setTimeout(() => poll(poll.n % 20 === 0), document.hidden ? 30000 : 3000);
  }
  const lastSeen = (n) => Math.max(st.seen[n] || 0, st.room?.people?.[n]?.last || 0);

  function notify(n) {
    if (!st.alert || !document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(`${name(n)} is in`, { body: "Brochiefs", tag: `in-${n}`, icon: "../icons/icon-192.png" }); } catch {}
  }
  async function keepAwake() {
    if (document.hidden || st.wake || !navigator.wakeLock) return;
    try { st.wake = await navigator.wakeLock.request("screen"); st.wake.addEventListener("release", () => { st.wake = null; }); } catch {}
  }

  // --- Render ------------------------------------------------------------
  function render() {
    if (st.gated) return;
    const room = st.room;
    if (!room) { app.innerHTML = `<div class="gate"><p>Connecting…</p></div>`; return; }
    // Only rebuild when something changed; the clocks tick on their own.
    const sig = JSON.stringify([room.feed.length, room.feed[0], room.people, st.seen, st.filter, [...st.open], st.shown, st.fresh.size, st.ok, st.cached, st.alert, st.copied, Object.keys(st.games).length, Math.floor(Date.now() / 60000)]);
    if (sig === st.sig) return;
    st.sig = sig;
    const people = room.people, feed = room.feed;
    const names = [...new Set([...st.names, ...Object.keys(people)])];
    const inNow = names.filter((n) => people[n]?.in).sort((a, b) => people[a].since - people[b].since);
    document.title = inNow.length ? `(${inNow.length} in) Brochiefs Live` : "Brochiefs Live";

    const order = names.slice().sort((a, b) => (people[b]?.in ? 1 : 0) - (people[a]?.in ? 1 : 0) || lastSeen(b) - lastSeen(a));
    const side = `<div class="label">People</div><div class="people">
      <button type="button" class="person all${st.filter ? "" : " sel"}" data-n=""><span class="nm">Everyone</span></button>
      ${order.map((n) => { const t = lastSeen(n), on = people[n]?.in; return `<button type="button" class="person${on ? " in" : ""}${st.filter === n ? " sel" : ""}" data-n="${esc(n)}">${av(n)}<span class="nm">${esc(name(n))}</span><span class="st num"${on ? ` data-since="${people[n].since}"` : ""}>${on ? clock(Date.now() - people[n].since) : t ? ago(t) : "not seen"}</span></button>`; }).join("")}
    </div>`;

    const last = order.find((n) => !people[n]?.in && lastSeen(n));
    const sum = inNow.length
      ? `<div class="sum live"><b>${inNow.length} in now</b><span>${inNow.map((n) => esc(name(n))).join(", ")}</span></div>`
      : `<div class="sum"><b>Nobody's in</b>${last ? `<span>Last in: ${esc(name(last))}, ${esc(ago(lastSeen(last)))}</span>` : ""}</div>`;

    const all = visits(feed, people).filter((s) => !st.filter || s.n === st.filter);
    // Each visit as plain text, for Copy: who, when, how long, and every
    // line in order.
    st.texts = new Map();
    for (const s of all.slice(0, st.shown)) {
      const when = s.live ? `in now, since ${hm(s.start)} (${dur(Date.now() - s.since)})` : `${hm(s.start)} to ${hm(s.end)} (${dur(Math.max(s.end - s.start, 1000))})`;
      const scr = s.live && SCREENS[people[s.n]?.screen] ? ` · on ${SCREENS[people[s.n].screen]}` : "";
      st.texts.set(`${s.n}|${s.start}`, [`${name(s.n)} · ${dayLab(s.start)} · ${when}${s.app ? ` · ${s.app === "home" ? "home screen app" : "browser"}` : ""}${scr}`,
        ...s.acts.map((a) => `  ${hm(a.at)}  ${a.a}${a.d ? `${/^for /.test(a.d) ? " " : ": "}${a.d}` : ""}${a.x > 1 ? ` (×${a.x})` : ""}`)].join("\n"));
    }
    let day = null;
    const cards = all.slice(0, st.shown).map((s) => {
      const d = dayLab(s.start), head = d !== day ? `<div class="label day">${esc(d)}</div>` : "";
      day = d;
      const id = `${s.n}|${s.start}`, LIM = 6, open = st.open.has(id);
      const acts = open ? s.acts : s.acts.slice(-LIM);
      const span = s.live ? "" : ` · ${dur(Math.max(s.end - s.start, 1000))}`;
      const meta = `${hm(s.start)}${s.live ? "" : s.done || s.end > s.start ? ` to ${hm(s.end)}` : ""}${span}${s.app ? ` · ${s.app === "home" ? "home screen app" : "browser"}` : ""}${s.live && people[s.n]?.screen && SCREENS[people[s.n].screen] ? ` · on ${SCREENS[people[s.n].screen]}` : ""}`;
      const fresh = s.acts.some((a) => a.ids.some((x) => st.fresh.has(x))) || st.fresh.has(`${s.n}|${s.start}|in`);
      return `${head}<div class="sess${s.live ? " live" : ""}${st.fresh.has(`${s.n}|${s.start}|in`) ? " fresh" : ""}">
        <div class="sh">${av(s.n, true)}<div class="who"><div class="nm">${esc(name(s.n))}</div><div class="meta num">${esc(meta)}</div></div><div class="sh-r"><span class="badge num"${s.live ? ` data-since="${s.since}"` : ""}>${s.live ? clock(Date.now() - s.since) : s.done ? "LEFT" : "ENDED"}</span><button type="button" class="cp${st.copied === id ? " ok" : ""}" data-copy="${esc(id)}" aria-label="Copy ${esc(name(s.n))}'s visit">${st.copied === id ? "Copied ✓" : "Copy"}</button></div></div>
        ${s.acts.length ? `<ul class="acts">${s.acts.length > LIM && !open ? `<li class="quiet"><span></span><span>${s.acts.length - LIM} earlier</span></li>` : ""}${acts.map((a) => { const pid = `${s.n}|${a.at}`; return `<li class="${a.ids.some((x) => st.fresh.has(x)) && fresh ? "new" : ""}${a.go ? " go" : ""}${st.pv?.id === pid ? " on" : ""}"${a.go ? ` data-go="${esc(a.go)}" data-pid="${esc(pid)}" data-who="${esc(s.n)}" data-at="${a.at}" data-what="${esc(a.a + (a.d ? ` ${a.d}` : ""))}" tabindex="0" role="button"` : ""}><time class="num">${esc(hm(a.at))}</time><span>${esc(a.a)}${a.d ? ` <em>${esc(a.d)}</em>` : ""}${a.x > 1 ? ` <span class="x">×${a.x}</span>` : ""}${a.go ? `<i class="peek" aria-hidden="true">▸</i>` : ""}</span></li>`; }).join("")}</ul>` : ""}
        ${s.acts.length > LIM ? `<button type="button" class="more" data-open="${esc(id)}">${open ? "Show less" : `Show all ${s.acts.length}`}</button>` : ""}
      </div>`;
    }).join("");

    app.innerHTML = `
      <div class="top${st.ok ? "" : " stale"}"><div class="top-in">
        <button type="button" class="brand" data-reload="1" aria-label="Refresh"><i class="beat"></i><b>BROCHIEFS</b><span>LIVE</span></button>
        <span class="age num" id="age">${st.cached ? "refreshing…" : st.ok ? "live" : "can't reach the server, retrying"}</span>
        <div class="tools">
          ${"Notification" in window ? `<button type="button" class="tool${st.alert ? " on" : ""}" data-alert="1">${st.alert ? "Alerts on" : "Alert me"}</button>` : ""}
          <button type="button" class="tool" data-signout="1">${device ? "Forget this device" : "Sign out"}</button>
        </div>
      </div></div>
      <div class="page">
        <aside class="side">${side}</aside>
        <main>
          ${sum}
          ${all.length ? `<div class="cpall"><button type="button" class="cp${st.copied === "*" ? " ok" : ""}" data-copy="*">${st.copied === "*" ? "Copied ✓" : `Copy ${st.filter ? `${esc(name(st.filter))}'s` : "all"} ${Math.min(all.length, st.shown)} visit${Math.min(all.length, st.shown) === 1 ? "" : "s"}`}</button></div>` : ""}
          ${cards || `<div class="empty" style="margin-top:14px">${st.filter ? `No visits from ${esc(name(st.filter))} in the last 24 hours.` : "No visits in the last 24 hours yet. They show here as people use the app."}</div>`}
          ${all.length > st.shown ? `<button type="button" class="older" data-older="1">Show ${Math.min(20, all.length - st.shown)} more</button>` : ""}
          <p class="note">A visit is live while the app is on screen and ends when it's put away, or about a minute after a phone goes quiet. Shows screens and features, never which team anyone picked. Jake isn't tracked.</p>
        </main>
      </div>`;
  }

  // Clocks and the "updated" line tick every second between checks.
  setInterval(() => {
    const a = document.getElementById("age");
    if (a && st.ok && st.at && !st.cached) a.textContent = `updated ${Math.round((Date.now() - st.at) / 1000)}s ago`;
    document.querySelectorAll("[data-since]").forEach((x) => { x.textContent = clock(Date.now() - Number(x.dataset.since)); });
  }, 1000);

  app.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("li.go")) { e.preventDefault(); e.target.click(); } });
  app.addEventListener("click", async (e) => {
    const li = e.target.closest("li.go");
    if (li) { st.pv?.id === li.dataset.pid ? closePreview() : openPreview(li.dataset); return; }
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.n !== undefined) { st.filter = b.dataset.n && st.filter !== b.dataset.n ? b.dataset.n : null; st.shown = 20; render(); window.scrollTo({ top: 0 }); return; }
    if (b.dataset.open) { st.open.has(b.dataset.open) ? st.open.delete(b.dataset.open) : st.open.add(b.dataset.open); render(); return; }
    if (b.dataset.older) { st.shown += 20; render(); return; }
    if (b.dataset.reload) { location.reload(); return; }
    if (b.dataset.copy) {
      const id = b.dataset.copy;
      const text = id === "*" ? `Brochiefs Live · ${st.filter ? name(st.filter) : "everyone"} · last 24 hours\n\n${[...st.texts.values()].join("\n\n")}` : st.texts.get(id) || "";
      if (!text || !(await copyText(text))) { b.textContent = "Couldn't copy"; return; }
      st.copied = id; render();
      clearTimeout(copyText.t); copyText.t = setTimeout(() => { st.copied = null; render(); }, 1600);
      return;
    }
    if (b.dataset.signout) { forget(); location.reload(); return; }
    if (b.dataset.alert) {
      if (!st.alert && Notification.permission !== "granted") { try { await Notification.requestPermission(); } catch {} }
      st.alert = !st.alert && Notification.permission === "granted";
      render();
    }
  });

  // The clipboard, called straight from the tap so iOS allows it; an older
  // browser gets a hidden text box and the copy command instead.
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    return ok;
  }

  // The preview: the app itself, framed like a phone, on the screen a line
  // names, as it looks now. Kept outside the page so it survives redraws.
  const pv = document.getElementById("pv");
  function openPreview(d) {
    st.pv = { id: d.pid };
    const when = hm(Number(d.at));
    const body = d.go === "picks"
      ? `<div class="pv-none"><b>No preview of someone's picks</b><span>Picks stay private until each game locks, so this shows nothing here. Their saved picks appear on the scoreboard once games lock.</span></div>`
      : `<div class="pv-frame"><iframe title="Preview" src="../index.html?view=${d.go}"></iframe></div>`;
    pv.innerHTML = `<div class="pv-h"><div class="pv-t"><b>${esc(name(d.who))}</b> · ${esc(when)}<span>${esc(d.what)}</span></div>
        ${d.go === "picks" ? "" : `<a class="tool" href="../index.html?view=${d.go}" target="_blank" rel="noopener">Open ↗</a>`}<button type="button" class="tool pv-x" aria-label="Close preview">✕</button></div>
      ${d.go === "picks" ? "" : `<div class="pv-note">How it looks now, not when ${esc(name(d.who))} saw it</div>`}${body}`;
    pv.querySelector(".pv-x").addEventListener("click", closePreview);
    document.body.classList.add("pv-open");
    st.sig = ""; render();
  }
  function closePreview() { st.pv = null; pv.innerHTML = ""; document.body.classList.remove("pv-open"); st.sig = ""; render(); }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && st.pv) closePreview(); });

  function gate(err = "") {
    st.gated = true;
    clearTimeout(poll.t);
    app.innerHTML = `<form class="gate"><h1>BROCHIEFS LIVE</h1><p>Enter the admin key.</p>
      <input type="text" name="username" value="Brochiefs Live" autocomplete="username" hidden>
      <input type="password" name="password" autocomplete="current-password" placeholder="Admin key" required>
      <label class="rem"><input type="checkbox" checked> Remember this device for 180 days</label>
      <button>Go live</button><div class="err">${esc(err)}</div></form>`;
    const input = app.querySelector('input[type="password"]'), btn = app.querySelector("form button");
    input.focus();
    app.querySelector("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const k = input.value.trim();
      if (app.querySelector('.rem input').checked) {
        btn.disabled = true; btn.textContent = "Checking…";
        const r = await remember(k);
        if (r === 403) { btn.disabled = false; btn.textContent = "Go live"; app.querySelector(".err").textContent = "That key didn't work."; return; }
        if (r !== 200) { key = k; session.set(KEY_STORE, k); } // couldn't reach the Worker: this session only
      } else { key = k; session.set(KEY_STORE, k); }
      start();
    });
  }
  function start() {
    st.gated = false; st.known = null; st.sig = "";
    // The last view straight away, marked as refreshing, then the real one.
    try {
      const snap = JSON.parse(store.get(SNAP_STORE) || "null");
      if (snap?.room) { st.room = snap.room; st.names = snap.names || []; st.seen = snap.seen || {}; st.games = snap.games || {}; st.cached = true; }
    } catch {}
    render();
    poll(true);
    keepAwake();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && (device || key) && !st.gated) { keepAwake(); poll(false); checkVersion(); } });

  // New versions: a home screen app has no reload, so this page compares
  // itself with the copy on the site now and then and on coming back, and
  // reloads onto a new one (never while a preview is open). Tapping the
  // title reloads too.
  let mine = null;
  async function checkVersion() {
    try {
      const text = await (await fetch(`./?t=${Date.now()}`, { cache: "no-store" })).text();
      let h = 7; for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
      if (mine === null) mine = h;
      else if (h !== mine && !st.pv && !document.hidden) location.reload();
    } catch {}
  }
  checkVersion();
  setInterval(() => { if (!document.hidden) checkVersion(); }, 5 * 60000);
  // A key saved by the first version of this page is traded for a device
  // token, then dropped.
  const oldKey = store.get(KEY_STORE);
  if (oldKey && !device) { store.del(KEY_STORE); remember(oldKey).then((r) => { if (r === 200) start(); else if (r === 403) gate(); else { key = oldKey; session.set(KEY_STORE, oldKey); start(); } }); }
  else if (device || key) start(); else gate();
})();
</script>
</body>
</html>
