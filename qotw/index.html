<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Question of the Week</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0221;--ink:#f4f0ff;--pink:#ff2079;--cyan:#05d9e8;--yel:#ffe45e;--grn:#39ff88;--pur:#c13cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(circle at 50% -10%,#2a0a5e,transparent 60%);color:var(--ink);font-family:VT323,monospace;font-size:21px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.kicker{font-family:"Press Start 2P";font-size:10px;color:var(--cyan);letter-spacing:2px;text-align:center}
h1{font-family:"Press Start 2P";font-size:clamp(18px,5vw,30px);line-height:1.4;text-align:center;margin:14px 0 6px;color:var(--yel);text-shadow:3px 3px 0 var(--pink)}
.sub{text-align:center;opacity:.75;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{border:2px solid var(--pur);border-radius:8px;padding:10px 6px;text-align:center;background:#1a0638}
.stat b{display:block;font-family:"Press Start 2P";font-size:clamp(12px,3.6vw,18px);color:var(--grn);margin-bottom:6px}
.stat span{font-size:17px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#16052f;border:2px solid var(--c);border-radius:10px;padding:14px;box-shadow:4px 4px 0 var(--c)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0d0221;font-family:"Press Start 2P";font-size:13px;flex:none}
.nm{font-family:"Press Start 2P";font-size:11px;color:var(--c)}
.tm{font-size:16px;opacity:.6}
.q{font-size:22px;line-height:1.25;margin:0;overflow-wrap:anywhere}
.red{background:#000;color:#000;padding:0 4px;border-radius:2px;font-size:.8em;letter-spacing:1px;user-select:none}
.soon{text-align:center;margin-top:30vh;font-family:"Press Start 2P";color:var(--yel);line-height:2}
.foot{text-align:center;opacity:.5;font-size:16px;margin-top:28px}
</style></head><body>
<div class="wrap" id="app"></div>
<script src="episodes.js"></script>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const eps = window.QOTW_EPISODES || [];
  const ep = eps.find((e) => e.id === p.get("ep")) || eps.find((e) => e.released) || (p.has("preview") ? eps[0] : null);
  const app = document.getElementById("app");
  if (!ep || (!ep.released && !p.has("preview"))) { app.innerHTML = '<div class="soon">QUESTION OF THE WEEK<br>COMING SOON</div>'; return; }
  const COLORS = { Robert: "#ff2079", Logan: "#05d9e8", Jordan: "#c13cff", Conlan: "#ffe45e", Dewitt: "#39ff88", Nissan: "#ff2079", Skills: "#05d9e8", Jake: "#c13cff", Curt: "#ffe45e", Andrew: "#39ff88" };
  const NAMES = { Conlan: "Connie" };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const body = (t) => esc(t).replace(/\[REDACTED\]/g, '<span class="red">REDACTED</span>');
  const a = ep.answers;
  const words = a.reduce((n, x) => n + x.text.split(/\s+/).length, 0);
  const longest = a.reduce((m, x) => (x.text.length > m.text.length ? x : m));
  app.innerHTML = `
    <div class="kicker">QUESTION OF THE WEEK · ${esc(ep.date)}</div>
    <h1>${esc(ep.question)}</h1>
    <div class="sub">The league has spoken. Every answer, verbatim.</div>
    <div class="stats">
      <div class="stat"><b>${a.length}/${a.length}</b><span>answered</span></div>
      <div class="stat"><b>${words}</b><span>total words</span></div>
      <div class="stat"><b>${esc((NAMES[longest.who] || longest.who).toUpperCase())}</b><span>longest answer</span></div>
    </div>
    <div class="grid">${a.map((x) => `
      <div class="card" style="--c:${COLORS[x.who] || "#ffe45e"}">
        <div class="hd"><div class="av">${esc((NAMES[x.who] || x.who)[0])}</div>
          <div><div class="nm">${esc((NAMES[x.who] || x.who).toUpperCase())}</div><div class="tm">${esc(x.at)}</div></div></div>
        <p class="q">“${body(x.text)}”</p>
      </div>`).join("")}</div>
    <div class="foot">Answers shown exactly as submitted. One name redacted.</div>`;
})();
</script>
</body></html>
