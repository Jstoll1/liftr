<!-- The 16 and 32 pixel favicons. Same subject and palette as the home
     screen icon, with the horizon grid and the sun slots taken out: at
     sixteen pixels those come to about two pixels of mud. The ball is the
     same sprite, scaled up to fill the square, so the two icons are
     recognisably the same thing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b0546"/>
      <stop offset="100%" stop-color="#12002b"/>
    </linearGradient>
    <linearGradient id="sun2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe45e"/>
      <stop offset="45%" stop-color="#ff9d3d"/>
      <stop offset="100%" stop-color="#ff2079"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky2)"/>
  <circle cx="512" cy="512" r="440" fill="url(#sun2)"/>
  <g transform="translate(512 512)" shape-rendering="crispEdges">
      <rect x="-120" y="-220" width="241" height="41" fill="#fff6e6"/>
      <rect x="-200" y="-180" width="401" height="41" fill="#fff6e6"/>
      <rect x="-280" y="-140" width="561" height="41" fill="#fff6e6"/>
      <rect x="-320" y="-100" width="641" height="41" fill="#fff6e6"/>
      <rect x="-360" y="-60" width="241" height="41" fill="#fff6e6"/>
      <rect x="-120" y="-60" width="41" height="41" fill="#ff2079"/>
      <rect x="-80" y="-60" width="41" height="41" fill="#fff6e6"/>
      <rect x="-40" y="-60" width="41" height="41" fill="#ff2079"/>
      <rect x="0" y="-60" width="41" height="41" fill="#fff6e6"/>
      <rect x="40" y="-60" width="41" height="41" fill="#ff2079"/>
      <rect x="80" y="-60" width="41" height="41" fill="#fff6e6"/>
      <rect x="120" y="-60" width="41" height="41" fill="#ff2079"/>
      <rect x="160" y="-60" width="201" height="41" fill="#fff6e6"/>
      <rect x="-400" y="-20" width="241" height="41" fill="#ffe9c9"/>
      <rect x="-160" y="-20" width="321" height="41" fill="#ff2079"/>
      <rect x="160" y="-20" width="241" height="41" fill="#ffe9c9"/>
      <rect x="-360" y="20" width="241" height="41" fill="#ffe9c9"/>
      <rect x="-120" y="20" width="41" height="41" fill="#ff2079"/>
      <rect x="-80" y="20" width="41" height="41" fill="#ffe9c9"/>
      <rect x="-40" y="20" width="41" height="41" fill="#ff2079"/>
      <rect x="0" y="20" width="41" height="41" fill="#ffe9c9"/>
      <rect x="40" y="20" width="41" height="41" fill="#ff2079"/>
      <rect x="80" y="20" width="41" height="41" fill="#ffe9c9"/>
      <rect x="120" y="20" width="41" height="41" fill="#ff2079"/>
      <rect x="160" y="20" width="201" height="41" fill="#ffe9c9"/>
      <rect x="-320" y="60" width="641" height="41" fill="#e7c08a"/>
      <rect x="-280" y="100" width="561" height="41" fill="#e7c08a"/>
      <rect x="-200" y="140" width="401" height="41" fill="#e7c08a"/>
      <rect x="-120" y="180" width="241" height="41" fill="#e7c08a"/>
  </g>
</svg>
