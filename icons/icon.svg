<!-- Home screen icon. Full bleed on purpose: the old one was a football
     floating on near-black, which reads as a sticker at 60px and wastes
     most of the square. This is the app's own splash in miniature, the
     arcade sun over a horizon grid, with a pixel football crossing it so
     the thing is identifiably a football pool and not a synthwave album.
     Everything that matters sits inside the middle 60% so a maskable
     circle crop on Android cannot cut it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12002b"/>
      <stop offset="45%" stop-color="#2b0546"/>
      <stop offset="72%" stop-color="#5c0d5e"/>
      <stop offset="100%" stop-color="#1a0332"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe45e"/>
      <stop offset="38%" stop-color="#ff9d3d"/>
      <stop offset="72%" stop-color="#ff2079"/>
      <stop offset="100%" stop-color="#c13cff"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e6"/>
      <stop offset="100%" stop-color="#ffd9a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2079" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff2079" stop-opacity="0"/>
    </radialGradient>
    <!-- the sun, minus the slots that make it read as retro rather than
         as a plain circle -->
    <mask id="slots">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <rect x="0" y="492" width="1024" height="20" fill="#000"/>
      <rect x="0" y="540" width="1024" height="26" fill="#000"/>
      <rect x="0" y="594" width="1024" height="33" fill="#000"/>
      <rect x="0" y="654" width="1024" height="42" fill="#000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="488" r="450" fill="url(#glow)"/>
  <circle cx="512" cy="470" r="278" fill="url(#sun)" mask="url(#slots)"/>

  <!-- horizon and the grid running off to it -->
  <g stroke="#05d9e8" fill="none">
    <line x1="0" y1="742" x2="1024" y2="742" stroke-width="7" opacity=".9"/>
    <g stroke-width="5" opacity=".42">
      <line x1="512" y1="742" x2="-360" y2="1024"/>
      <line x1="512" y1="742" x2="-30" y2="1024"/>
      <line x1="512" y1="742" x2="266" y2="1024"/>
      <line x1="512" y1="742" x2="512" y2="1024"/>
      <line x1="512" y1="742" x2="758" y2="1024"/>
      <line x1="512" y1="742" x2="1054" y2="1024"/>
      <line x1="512" y1="742" x2="1384" y2="1024"/>
    </g>
    <g stroke-width="5" opacity=".42">
      <line x1="0" y1="790" x2="1024" y2="790"/>
      <line x1="0" y1="858" x2="1024" y2="858"/>
      <line x1="0" y1="952" x2="1024" y2="952"/>
    </g>
  </g>

  <!-- The football as a sprite on a 20 by 11 grid. Two earlier versions
       were wrong in opposite directions: a 5 by 3 grid is too coarse to
       taper and reads as three stacked bars, and a smooth silhouette reads
       fine but looks like any sports app when everything around it is
       pixel type on a synthwave grid.
       Unrotated, because tilting a sprite anti-aliases the grid it is made
       of. Flat tones rather than a gradient, because a gradient fill runs
       per rect and repeats itself on every row. -->
  <g transform="translate(512 470)" shape-rendering="crispEdges">
    <g>
      <rect x="-64" y="-127" width="157" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-116" y="-101" width="261" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-168" y="-75" width="365" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-194" y="-49" width="417" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-220" y="-23" width="469" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-246" y="3" width="521" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-220" y="29" width="469" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-194" y="55" width="417" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-168" y="81" width="365" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-116" y="107" width="261" height="27" fill="#0a0014" opacity=".38"/>
      <rect x="-64" y="133" width="157" height="27" fill="#0a0014" opacity=".38"/>
    </g>
    <g>
      <rect x="-78" y="-143" width="157" height="27" fill="#fff6e6"/>
      <rect x="-130" y="-117" width="261" height="27" fill="#fff6e6"/>
      <rect x="-182" y="-91" width="365" height="27" fill="#fff6e6"/>
      <rect x="-208" y="-65" width="417" height="27" fill="#fff6e6"/>
      <rect x="-234" y="-39" width="157" height="27" fill="#fff6e6"/>
      <rect x="-78" y="-39" width="27" height="27" fill="#ff2079"/>
      <rect x="-52" y="-39" width="27" height="27" fill="#fff6e6"/>
      <rect x="-26" y="-39" width="27" height="27" fill="#ff2079"/>
      <rect x="0" y="-39" width="27" height="27" fill="#fff6e6"/>
      <rect x="26" y="-39" width="27" height="27" fill="#ff2079"/>
      <rect x="52" y="-39" width="27" height="27" fill="#fff6e6"/>
      <rect x="78" y="-39" width="27" height="27" fill="#ff2079"/>
      <rect x="104" y="-39" width="131" height="27" fill="#fff6e6"/>
      <rect x="-260" y="-13" width="157" height="27" fill="#ffe9c9"/>
      <rect x="-104" y="-13" width="209" height="27" fill="#ff2079"/>
      <rect x="104" y="-13" width="157" height="27" fill="#ffe9c9"/>
      <rect x="-234" y="13" width="157" height="27" fill="#ffe9c9"/>
      <rect x="-78" y="13" width="27" height="27" fill="#ff2079"/>
      <rect x="-52" y="13" width="27" height="27" fill="#ffe9c9"/>
      <rect x="-26" y="13" width="27" height="27" fill="#ff2079"/>
      <rect x="0" y="13" width="27" height="27" fill="#ffe9c9"/>
      <rect x="26" y="13" width="27" height="27" fill="#ff2079"/>
      <rect x="52" y="13" width="27" height="27" fill="#ffe9c9"/>
      <rect x="78" y="13" width="27" height="27" fill="#ff2079"/>
      <rect x="104" y="13" width="131" height="27" fill="#ffe9c9"/>
      <rect x="-208" y="39" width="417" height="27" fill="#e7c08a"/>
      <rect x="-182" y="65" width="365" height="27" fill="#e7c08a"/>
      <rect x="-130" y="91" width="261" height="27" fill="#e7c08a"/>
      <rect x="-78" y="117" width="157" height="27" fill="#e7c08a"/>
    </g>
  </g>
</svg>
