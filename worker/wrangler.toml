name = "liftr-ai"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Locks down CORS so only your deployed site(s) can call this Worker.
# Comma-separated — the pick'em app now lives at brochiefs.com, but the
# raw GitHub Pages URL still works too, so both are allowed.
[vars]
# The preview site (Cloudflare Pages, preview branch) reads real data; the
# app writes nothing from there. *.host allows its per-branch addresses.
ALLOWED_ORIGIN = "https://brochiefs.com,https://www.brochiefs.com,https://jstoll1.github.io,https://brochiefs-preview.pages.dev,https://*.brochiefs-preview.pages.dev"
# Shared default for chat/swap/opening — cheap, fast, plenty good for
# conversational replies and one-exercise substitutions.
OPENAI_MODEL = "gpt-4o-mini"
# The exercise-picking engine specifically — the highest-stakes call, since
# it's the one actually building the workout. Set to a stronger model than
# OPENAI_MODEL above; same API key, no new token needed. Costs more per
# call (still fractions of a cent at this volume) — drop this line to fall
# back to OPENAI_MODEL if you'd rather keep everything on gpt-4o-mini.
OPENAI_MODEL_PLAN = "gpt-4o"

# Owner login. "off" ships the endpoints without changing anything: picks
# save exactly as they do today, tokens are ignored. "soft" still accepts
# every pick but marks the ones that arrived without a login in the picks
# log. "on" makes a token mandatory — an owner who has not claimed their
# name cannot save until they do.
AUTH_MODE = "off"
# The Creative Engine's monthly OpenAI image budget, in dollars.
CREATIVE_MONTHLY_CAP_USD = "10"

# OPENAI_API_KEY is a secret, not a var — never put it in this file.
# Set it with: wrangler secret put OPENAI_API_KEY
# AUTH_MODE above is only the fallback: once the app console sets a mode it
# is stored in KV and that wins, so the switch needs no deploy.
#
# Two administrators, two keys. ARCHIVE_LOG_KEY is the app owner's and opens
# everything. SLATE_KEY belongs to whoever picks the games and opens the
# slate editor alone — it cannot read a log or reset an owner's code.
#   wrangler secret put SLATE_KEY
#
# AUTH_SECRET signs the login tokens. Any long random string; changing it
# signs everyone out. Set it with: wrangler secret put AUTH_SECRET

# Cross-device sync storage. Create the namespace once with:
#   npx wrangler kv namespace create LIFTR_KV
# then replace the id below with the one it prints, and redeploy.
# The live room (worker/src/live.js): who is in the app now, for the
# admin's live page. One Durable Object, SQLite backed.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[durable_objects.bindings]]
name = "CREATIVE_DESK"
class_name = "CreativeDesk"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CreativeDesk"]

# AI graphics (the Creative Studio): originals and optimized copies.
[[r2_buckets]]
binding = "CREATIVE"
bucket_name = "brochiefs-creative"

[[kv_namespaces]]
binding = "LIFTR_KV"
id = "2b89a5d262d84832801fe39e3cdc8301"

# Monday 10:00 UTC, which is 6 AM Eastern in the fall. Seals any week that
# is still open by fetching finals from ESPN, in case no phone did.
[triggers]
# Monday 10:00 UTC seals the week. The rest sample the lines for every
# game still open: every two hours Tuesday to Friday, hourly on Saturday
# until the first kickoff (after that a run finds nothing open and stops).
crons = ["0 10 * * 1", "0 */2 * * 2-5", "0 * * * 6"]

# --- NFL league -------------------------------------------------------
# A second Worker, liftr-nfl, from the same code: `wrangler deploy --env
# nfl` (the deploy workflow does this for pushes to the nfl branch). SPORT
# switches the ESPN feeds, prompts, lock rule and member list; its own KV
# namespace keeps every NFL pick, login and log apart from the college
# league. Vars, KV and crons do not carry over from the top of this file,
# so each is set again here. Its secrets (ARCHIVE_LOG_KEY, SLATE_KEY,
# AUTH_SECRET, OPENAI_API_KEY) are set on the liftr-nfl Worker itself.
[env.nfl]
name = "liftr-nfl"

[env.nfl.vars]
SPORT = "nfl"
# The members until the admin saves a list in the console (Owners tab).
DEFAULT_ROSTER = "Ben,Nathan,Jake"
# News and expert-pick articles come from the NFL branch's own feed files,
# never the college ones (the code's default reads main).
FEEDS_URL = "https://raw.githubusercontent.com/Jstoll1/liftr/nfl/data/feeds"
# brochiefs.com is here for the live page (brochiefs.com/live), which reads
# this league's room with the admin key.
ALLOWED_ORIGIN = "https://nfl.brochiefs.com,https://liftr-1h0.pages.dev,https://*.liftr-1h0.pages.dev,https://brochiefs.com,https://www.brochiefs.com"
OPENAI_MODEL = "gpt-4o-mini"
OPENAI_MODEL_PLAN = "gpt-4o"
# A new league starts with logins required: each member claims their name
# with a code the first time they open the app.
AUTH_MODE = "on"

# The live room for brochiefs.com/live, the same Durable Object the college
# Worker runs, with its own storage under this Worker.
[[env.nfl.durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[env.nfl.migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

[[env.nfl.kv_namespaces]]
binding = "LIFTR_KV"
id = "44e880a55bcc406890b700ca487025e1"

# Tuesday 10:00 UTC seals the week, after Monday night. The rest sample
# the lines for every game still open: every two hours Tuesday to
# Saturday, hourly on Sunday, and Monday at half past as a backstop seal
# after Sunday night. Days by name: Cloudflare numbers weekdays
# 1 to 7, so names cannot be misread.
[env.nfl.triggers]
crons = ["0 10 * * TUE", "0 */2 * * TUE-SAT", "0 * * * SUN", "30 * * * MON"]
