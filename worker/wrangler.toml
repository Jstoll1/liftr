name = "liftr-ai"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Locks down CORS so only your deployed site can call this Worker.
# Update this if your GitHub Pages URL is different.
[vars]
ALLOWED_ORIGIN = "https://jstoll1.github.io"
OPENAI_MODEL = "gpt-4o-mini"

# OPENAI_API_KEY is a secret, not a var — never put it in this file.
# Set it with: wrangler secret put OPENAI_API_KEY
