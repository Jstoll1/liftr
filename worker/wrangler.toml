name = "liftr-ai"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Locks down CORS so only your deployed site(s) can call this Worker.
# Comma-separated — the pick'em app now lives at brochiefs.com, but the
# raw GitHub Pages URL still works too, so both are allowed.
[vars]
ALLOWED_ORIGIN = "https://brochiefs.com,https://www.brochiefs.com,https://jstoll1.github.io"
# Shared default for chat/swap/opening — cheap, fast, plenty good for
# conversational replies and one-exercise substitutions.
OPENAI_MODEL = "gpt-4o-mini"
# The exercise-picking engine specifically — the highest-stakes call, since
# it's the one actually building the workout. Set to a stronger model than
# OPENAI_MODEL above; same API key, no new token needed. Costs more per
# call (still fractions of a cent at this volume) — drop this line to fall
# back to OPENAI_MODEL if you'd rather keep everything on gpt-4o-mini.
OPENAI_MODEL_PLAN = "gpt-4o"

# Owner login. "off" ships the endpoints without changing anything: picks
# save exactly as they do today, tokens are ignored. "soft" still accepts
# every pick but marks the ones that arrived without a login in the picks
# log. "on" makes a token mandatory — an owner who has not claimed their
# name cannot save until they do.
AUTH_MODE = "off"

# OPENAI_API_KEY is a secret, not a var — never put it in this file.
# Set it with: wrangler secret put OPENAI_API_KEY
# AUTH_MODE above is only the fallback: once the app console sets a mode it
# is stored in KV and that wins, so the switch needs no deploy.
#
# Two administrators, two keys. ARCHIVE_LOG_KEY is the app owner's and opens
# everything. SLATE_KEY belongs to whoever picks the games and opens the
# slate editor alone — it cannot read a log or reset an owner's code.
#   wrangler secret put SLATE_KEY
#
# AUTH_SECRET signs the login tokens. Any long random string; changing it
# signs everyone out. Set it with: wrangler secret put AUTH_SECRET

# Cross-device sync storage. Create the namespace once with:
#   npx wrangler kv namespace create LIFTR_KV
# then replace the id below with the one it prints, and redeploy.
[[kv_namespaces]]
binding = "LIFTR_KV"
id = "2b89a5d262d84832801fe39e3cdc8301"
